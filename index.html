<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supernova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#080828; --navy-2:#0e0e38; --ice:#EBF4FF; --gold:#FFBC3A;
    --blue:#4D88E8; --orange:#F26444; --cyan:#40BDA9; --white:#fff;
    --font-en:'Poppins',sans-serif; --font-ar:'Tajawal',sans-serif; --font:var(--font-ar);
    --mono-en:'Space Mono',monospace; --mono-ar:'Tajawal',sans-serif; --mono:var(--mono-ar);
  }
  html[lang="en"]{ --font:var(--font-en); --mono:var(--mono-en); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;
    background:
      radial-gradient(1400px 700px at 8% -12%, rgba(77,136,232,.26), transparent 58%),
      radial-gradient(1100px 600px at 108% 10%, rgba(255,188,58,.18), transparent 55%),
      radial-gradient(900px 500px at 50% 105%, rgba(64,189,169,.14), transparent 55%),
      var(--navy);
    color:var(--ice); font-family:var(--font);}

  .app{max-width:1320px; margin:0 auto; padding:0 32px 90px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 0 24px; margin-bottom:54px;
    border-bottom:1px solid rgba(235,244,255,.1);
  }
  .brand img{ height:36px; width:auto; display:block; }
  .top-tag{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(235,244,255,.45); border:1px solid rgba(235,244,255,.16); border-radius:999px;
    padding:8px 16px; display:flex; align-items:center; gap:8px;
  }
  .top-tag .dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .lang-toggle{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold); background:rgba(255,188,58,.08); border:1px solid rgba(255,188,58,.35); border-radius:999px;
    padding:8px 18px; cursor:pointer; transition:background .2s, transform .15s;
  }
  .lang-toggle:hover{ background:rgba(255,188,58,.18); transform:translateY(-1px); }
  .lang-toggle:active{ transform:translateY(0) scale(.97); }

  .dir-arrow-fwd::before{ content:"\2192"; }
  .dir-arrow-back::before{ content:"\2190"; }
  html[dir="rtl"] .dir-arrow-fwd::before{ content:"\2190"; }
  html[dir="rtl"] .dir-arrow-back::before{ content:"\2192"; }
  html[dir="rtl"] .quote::before{ content:"\00AB"; }
  html[dir="rtl"] .quote::after{ content:"\00BB"; }

  .head{text-align:center; max-width:820px; margin:0 auto 40px;}
  .eyebrow{font-family:var(--mono); letter-spacing:.2em; font-size:12.5px; text-transform:uppercase; color:var(--gold); margin-bottom:18px;
    display:flex; align-items:center; justify-content:center; gap:14px;}
  .eyebrow::before,.eyebrow::after{content:""; height:1px; width:36px; background:rgba(255,188,58,.45);}
  h1{font-size:clamp(34px,5.2vw,58px); font-weight:900; margin:0 0 20px; line-height:1.12; letter-spacing:-0.01em;}
  h1 span{color:var(--gold);}
  .sub{color:rgba(235,244,255,.68); font-size:17px; line-height:1.65; max-width:640px; margin:0 auto;}

  .stat-strip{
    display:flex; align-items:center; justify-content:center; gap:16px; margin:34px auto 64px;
    max-width:620px; padding:18px 28px; border-radius:16px;
    background:rgba(235,244,255,.045); border:1px solid rgba(235,244,255,.12);
  }
  .stat-strip .num{ font-family:var(--mono); font-size:36px; font-weight:700; color:var(--gold); line-height:1; flex-shrink:0; }
  .stat-strip .txt{ font-size:13.5px; line-height:1.5; color:rgba(235,244,255,.65); text-align:left; }
  .stat-strip .txt b{ color:var(--ice); font-weight:700; }

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
  @media (max-width:1100px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} .stat-strip{flex-direction:column; text-align:center;} .stat-strip .txt{text-align:center;} }

  .card{
    position:relative;
    background:linear-gradient(165deg, rgba(235,244,255,.05), rgba(235,244,255,.015));
    border:1px solid rgba(235,244,255,.14); border-radius:22px;
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
  }
  .card:hover{
    transform:translateY(-8px);
    border-color:var(--card-accent, rgba(255,188,58,.5));
    box-shadow:0 24px 48px -16px rgba(0,0,0,.55), 0 0 0 1px var(--card-accent, rgba(255,188,58,.3));
  }
  .card:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .card-num{
    position:absolute; top:14px; inset-inline-end:16px; z-index:2;
    font-family:var(--mono); font-size:34px; font-weight:700;
    color:rgba(255,255,255,.16); line-height:1; letter-spacing:-.02em;
    transition:color .25s;
  }
  .card:hover .card-num{ color:var(--card-accent, rgba(255,188,58,.55)); }

  .photo-wrap{ position:relative; aspect-ratio:3/4; overflow:hidden; background:#04041a; }
  .photo-wrap img, .photo-wrap .avatar-svg{ width:100%; height:100%; object-fit:cover; object-position:center 12%; display:block; transition:transform .4s; }
  .card:hover .photo-wrap img, .card:hover .photo-wrap .avatar-svg{ transform:scale(1.05); }
  .photo-wrap::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(8,8,40,.75) 92%, var(--navy) 100%);
    pointer-events:none;
  }
  .photo-wrap::before{
    content:""; position:absolute; inset:0; z-index:1;
    background:var(--card-accent, var(--gold)); opacity:.16; mix-blend-mode:color;
    pointer-events:none;
  }

  .badge{
    position:absolute; bottom:12px; left:14px; right:14px; z-index:2;
    font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:7px 12px; border-radius:10px; font-weight:700;
    background:rgba(8,8,40,.65); backdrop-filter:blur(6px);
    border:1px solid var(--card-accent, rgba(255,188,58,.4));
    color:var(--card-accent, var(--gold));
  }

  .info{ padding:20px 20px 24px; position:relative; }
  .name{ font-weight:800; font-size:21px; margin-bottom:5px; letter-spacing:-.01em; }
  .role{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:rgba(235,244,255,.4); margin-bottom:14px; }
  .quote{ font-size:13.5px; line-height:1.6; color:rgba(235,244,255,.72); font-style:italic; min-height:52px; }
  .quote::before{ content:"\201C"; color:var(--card-accent, var(--gold)); font-style:normal; font-weight:700; }
  .quote::after{ content:"\201D"; color:var(--card-accent, var(--gold)); font-style:normal; font-weight:700; }

  .tap-hint{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--card-accent, var(--gold)); margin-top:16px; display:flex; align-items:center; gap:7px;
    font-weight:700; opacity:.85;
  }
  .tap-hint::after{ content:"\2192"; transition:transform .2s; }
  html[dir="rtl"] .tap-hint::after{ content:"\2190"; }
  .card:hover .tap-hint::after{ transform:translateX(4px); }
  html[dir="rtl"] .card:hover .tap-hint::after{ transform:translateX(-4px); }

  .card.c-risk{ --card-accent: var(--orange); }
  .card.c-motivation{ --card-accent: var(--gold); }
  .card.c-practice{ --card-accent: var(--cyan); }
  .card.c-social{ --card-accent: var(--blue); }
  .card.c-general{ --card-accent: var(--gold); }

  .overlay{
    position:fixed; inset:0; background:rgba(4,4,20,.82); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:100;
  }
  .overlay.show{ display:flex; }
  .modal{
    position:relative; max-width:660px; width:100%; max-height:85vh; overflow-y:auto;
    background:var(--navy-2); border:1px solid rgba(235,244,255,.16); border-radius:24px;
    padding:42px 44px 40px; animation:pop .22s ease;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal-close{
    position:absolute; top:20px; inset-inline-end:20px; width:36px; height:36px; border-radius:50%;
    background:rgba(235,244,255,.08); border:1px solid rgba(235,244,255,.18); color:var(--ice);
    font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ background:rgba(235,244,255,.18); }
  .modal-badge{
    display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    padding:6px 14px; border-radius:999px; font-weight:700; margin-bottom:18px;
    background:rgba(255,255,255,.06);
  }
  .modal-eyebrow{ font-family:var(--mono); letter-spacing:.18em; font-size:11.5px; text-transform:uppercase; color:var(--gold); margin-bottom:12px; }
  .modal-title{ font-size:30px; font-weight:900; margin:0 0 20px; line-height:1.22; letter-spacing:-.01em; }
  .modal-stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 22px; }
  .modal-stat{ border-radius:14px; padding:14px 16px; border:1px solid rgba(235,244,255,.14); background:rgba(235,244,255,.04); }
  .modal-stat .ms-label{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:rgba(235,244,255,.5); margin-bottom:6px; }
  .modal-stat .ms-val{ font-size:15px; font-weight:800; line-height:1.35; }
  .modal-stat.ms-test{ border-color:rgba(64,189,169,.4); background:rgba(64,189,169,.08); }
  .modal-stat.ms-test .ms-val{ color:var(--cyan); font-family:var(--mono); font-size:26px; }
  .modal-stat.ms-field{ border-color:rgba(242,100,68,.4); background:rgba(242,100,68,.08); }
  .modal-stat.ms-field .ms-val{ color:var(--orange); }
  @media (max-width:480px){ .modal-stats{ grid-template-columns:1fr; } }
  .modal-body{ font-size:16px; line-height:1.75; color:rgba(235,244,255,.85); margin-bottom:22px; }
  .modal-closing{ font-size:16px; line-height:1.65; color:var(--gold); font-style:italic; font-weight:700; }

  footer{ text-align:center; margin-top:0; padding-top:28px; border-top:1px solid rgba(235,244,255,.08);
    font-family:var(--mono); font-size:11px; color:rgba(235,244,255,.35); }

  #mainView{ transition:opacity .35s ease; }
  #mainView.hiding{ opacity:0; pointer-events:none; }

  .finish-row{ display:flex; justify-content:center; margin-top:56px; }
  .finish-btn{
    font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:var(--gold); color:var(--navy); border:none; border-radius:999px;
    padding:16px 38px; cursor:pointer; display:flex; align-items:center; gap:10px;
    box-shadow:0 14px 30px -10px rgba(255,188,58,.5); transition:transform .18s, box-shadow .18s;
  }
  .finish-btn:hover{ transform:translateY(-2px); box-shadow:0 18px 36px -10px rgba(255,188,58,.6); }
  .finish-btn:active{ transform:translateY(0) scale(.98); }
  .finish-btn span{ transition:transform .18s; display:inline-block; }
  .finish-btn:hover span{ transform:translateX(4px); }

  /* ===== Final animated stat section ===== */
  .finale{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:flex-start; justify-content:center; text-align:center;
    overflow-y:auto; padding:100px 32px;
    background:radial-gradient(900px 600px at 50% 40%, rgba(255,188,58,.10), transparent 65%), #050518;
  }
  .finale.show{ display:flex; }
  .finale-back{
    position:absolute; top:28px; left:32px; z-index:3;
    background:rgba(235,244,255,.06); border:1px solid rgba(235,244,255,.16); color:rgba(235,244,255,.6);
    font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; border-radius:999px;
    padding:9px 18px; cursor:pointer;
  }
  .finale-back:hover{ background:rgba(235,244,255,.12); color:var(--ice); }
  .finale-orb{
    position:absolute; border-radius:50%; filter:blur(2px); pointer-events:none;
    animation:drift 14s ease-in-out infinite;
  }
  .finale-orb.o1{ width:420px; height:420px; background:radial-gradient(circle, rgba(77,136,232,.28), transparent 70%); top:-140px; left:-100px; animation-duration:16s; }
  .finale-orb.o2{ width:360px; height:360px; background:radial-gradient(circle, rgba(255,188,58,.22), transparent 70%); bottom:-120px; right:-80px; animation-duration:19s; animation-delay:-4s; }
  .finale-orb.o3{ width:260px; height:260px; background:radial-gradient(circle, rgba(64,189,169,.22), transparent 70%); top:40%; right:8%; animation-duration:13s; animation-delay:-7s; }
  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(24px,-28px) scale(1.06); }
  }

  .finale-inner{ position:relative; z-index:2; max-width:760px; margin:auto; }
  .finale-eyebrow{
    font-family:var(--mono); letter-spacing:.22em; font-size:12.5px; text-transform:uppercase; color:var(--gold);
    margin-bottom:28px; opacity:0; transform:translateY(14px);
  }
  .finale-eyebrow::before,.finale-eyebrow::after{content:"\2014 "; opacity:.5;}

  .finale-num-wrap{ position:relative; display:inline-block; margin-bottom:30px; }
  .finale-num{
    font-family:var(--mono); font-size:clamp(90px,16vw,180px); font-weight:700; line-height:1;
    background:linear-gradient(180deg, #FFD98A 0%, var(--gold) 55%, #C8871A 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; transform:scale(.85);
    filter:drop-shadow(0 0 40px rgba(255,188,58,.35));
  }
  .finale-num-ring{
    position:absolute; inset:-18px; border-radius:50%; border:1px solid rgba(255,188,58,.25);
    opacity:0; transform:scale(.9);
  }

  .finale-line{ font-size:clamp(20px,2.6vw,26px); line-height:1.55; color:var(--ice); font-weight:600; margin-bottom:18px;
    opacity:0; transform:translateY(16px); }
  .finale-line b{ color:var(--gold); }
  .finale-sub{ font-size:14.5px; color:rgba(235,244,255,.5); line-height:1.7; max-width:520px; margin:0 auto 34px;
    opacity:0; transform:translateY(14px); }

  .finale-people{ display:flex; align-items:center; justify-content:center; gap:-10px; margin-bottom:22px;
    opacity:0; transform:translateY(14px); }
  .finale-people .avatar{
    width:52px; height:52px; border-radius:50%; overflow:hidden; border:2px solid #050518;
    margin-inline-start:-14px; box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .finale-people .avatar:first-child{ margin-inline-start:0; }
  .finale-people .avatar img, .finale-people .avatar .avatar-svg{ width:100%; height:100%; object-fit:cover; object-position:center 12%; }

  .finale-principles{
    max-width:560px; margin:0 auto 30px; padding:22px 24px;
    background:rgba(255,188,58,.05); border:1px solid rgba(255,188,58,.18); border-radius:18px;
    text-align:start; opacity:0; transform:translateY(14px);
  }
  .finale-principles h3{
    font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold); margin:0 0 14px; text-align:center;
  }
  .finale-principles ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .finale-principles li{
    display:flex; gap:10px; align-items:baseline; font-size:13.5px; line-height:1.55; color:rgba(235,244,255,.75);
  }
  .finale-principles li b{ color:var(--ice); font-weight:700; }
  .finale-principles li > span:first-child{ color:var(--gold); flex-shrink:0; }
  .finale.in-view .finale-principles{ animation:riseIn .7s ease 1.15s forwards; }

  .finale-source{
    font-family:var(--mono); font-size:10.5px; color:rgba(235,244,255,.32);
    opacity:0; transform:translateY(10px);
  }

  .finale.in-view .finale-eyebrow{ animation:riseIn .7s ease forwards; }
  .finale.in-view .finale-num{ animation:numIn .9s cubic-bezier(.2,.8,.2,1) .15s forwards; }
  .finale.in-view .finale-num-ring{ animation:ringIn 1.1s ease .15s forwards; }
  .finale.in-view .finale-line{ animation:riseIn .7s ease .45s forwards; }
  .finale.in-view .finale-sub{ animation:riseIn .7s ease .6s forwards; }
  .finale.in-view .finale-people{ animation:riseIn .7s ease .75s forwards; }
  .finale.in-view .finale-source{ animation:riseIn .7s ease 1.35s forwards; }

  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes numIn{ to{ opacity:1; transform:scale(1); } }
  @keyframes ringIn{ 0%{opacity:0; transform:scale(.9);} 60%{opacity:1;} 100%{opacity:0; transform:scale(1.35);} }

  @media (max-width:600px){
    .finale{ padding:80px 20px; }
  }

  /* ===== Matching challenge ===== */
  .match-card{ cursor:pointer; }
  .match-card .badge{ transition:background .2s, color .2s, border-color .2s; }
  .match-card.solved{ outline:2px solid var(--card-accent, var(--gold)); outline-offset:2px; }
  .match-card.solved .badge{ background:var(--card-accent, var(--gold)); color:var(--navy); }
  .match-card.hint-shake{ animation:shakeCard .4s ease; }
  @keyframes shakeCard{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .match-card.drop-hover{ box-shadow:0 0 0 2px var(--card-accent, var(--gold)) inset, 0 24px 48px -16px rgba(0,0,0,.55); }

  .challenge-panel{
    max-width:900px; margin:40px auto 0; padding:24px 26px 26px;
    background:rgba(235,244,255,.035); border:1px solid rgba(235,244,255,.12); border-radius:20px;
    text-align:center;
  }
  .challenge-instructions{ font-size:14.5px; color:rgba(235,244,255,.7); line-height:1.6; margin:0 0 18px; }
  .chip-tray{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; min-height:46px; margin-bottom:18px; }
  .chip{
    font-family:var(--mono); font-size:12.5px; font-weight:700; letter-spacing:.03em;
    padding:12px 20px; border-radius:999px; cursor:grab; user-select:none;
    background:rgba(255,188,58,.1); border:1.5px dashed rgba(255,188,58,.5); color:var(--gold);
    transition:transform .15s, opacity .2s, box-shadow .15s;
  }
  .chip:hover{ transform:translateY(-2px); box-shadow:0 8px 18px -8px rgba(255,188,58,.5); }
  .chip.selected{ box-shadow:0 0 0 2px var(--gold); background:rgba(255,188,58,.22); }
  .chip.used{ opacity:0; pointer-events:none; transform:scale(.6); }
  .chip.dragging-ghost{
    position:fixed; z-index:200; pointer-events:none; opacity:.92;
    box-shadow:0 14px 30px -8px rgba(0,0,0,.6);
  }
  .score-pill{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:13px; font-weight:700;
    color:var(--ice); background:rgba(235,244,255,.06); border:1px solid rgba(235,244,255,.16);
    padding:9px 20px; border-radius:999px;
  }
  .score-icon{ font-size:15px; }
  #finishBtn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  #finishBtn:disabled:hover{ transform:none; }

  .modal-reflect{
    margin-top:24px; padding-top:22px; border-top:1px solid rgba(235,244,255,.1);
  }
  .modal-reflect .reflect-q{ font-size:14px; font-weight:700; color:var(--ice); margin-bottom:12px; }
  .modal-reflect .reflect-opts{ display:flex; flex-direction:column; gap:10px; }
  .modal-reflect .reflect-opt{
    text-align:start; font-family:var(--font); font-size:13.5px; color:rgba(235,244,255,.85);
    background:rgba(235,244,255,.05); border:1px solid rgba(235,244,255,.15); border-radius:12px;
    padding:11px 16px; cursor:pointer; transition:background .2s, border-color .2s;
  }
  .modal-reflect .reflect-opt:hover{ background:rgba(235,244,255,.1); }
  .modal-reflect .reflect-opt.picked{ border-color:var(--gold); background:rgba(255,188,58,.1); }
  .modal-reflect .reflect-feedback{
    margin-top:12px; font-size:13.5px; line-height:1.6; color:var(--gold); font-weight:600;
    opacity:0; transform:translateY(6px); transition:opacity .3s, transform .3s;
  }
  .modal-reflect .reflect-feedback.show{ opacity:1; transform:translateY(0); }

  .finale-score{
    font-family:var(--mono); font-size:14px; color:var(--gold); font-weight:700;
    margin:-8px 0 14px; opacity:0; transform:translateY(12px);
  }
  .finale-meta{
    font-size:13px; color:rgba(235,244,255,.42); line-height:1.7; max-width:480px; margin:0 auto 30px;
    opacity:0; transform:translateY(12px);
  }
  .finale.in-view .finale-score{ animation:riseIn .7s ease .5s forwards; }

  .tr-podium{ display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:16px; align-items:end; max-width:980px; margin:0 auto 24px; }
  .tr-pod{ position:relative; text-align:center; padding:22px 14px 0; border-radius:22px 22px 0 0; background:linear-gradient(180deg, rgba(235,244,255,.08), rgba(235,244,255,.02)); border:1px solid rgba(235,244,255,.12); border-bottom:none; overflow:hidden; }
  .tr-pod.p1{ background:linear-gradient(180deg, rgba(255,188,58,.22), rgba(255,188,58,.04)); border-color:rgba(255,188,58,.5); }
  .tr-pod-medal{ position:absolute; top:12px; inset-inline-start:14px; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-weight:700; color:var(--navy); background:#C9D3E0; }
  .tr-pod.p1 .tr-pod-medal{ background:var(--gold); }
  .tr-pod.p3 .tr-pod-medal{ background:#D99161; }
  .tr-pod-av{ width:78px; height:78px; margin:0 auto 10px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:26px; color:var(--navy); background:linear-gradient(135deg, #EBF4FF, #b9c8e0); }
  .tr-pod.p1 .tr-pod-av{ width:96px; height:96px; font-size:32px; background:linear-gradient(135deg, var(--gold), #ffe7a8); box-shadow:0 0 40px rgba(255,188,58,.5); }
  .tr-pod-name{ font-size:18px; font-weight:900; line-height:1.35; }
  .tr-pod.p1 .tr-pod-name{ font-size:22px; }
  .tr-pod-dept{ font-size:12.5px; color:rgba(235,244,255,.55); margin:2px 0 8px; }
  .tr-pod-pts{ font-family:var(--mono); font-size:30px; font-weight:700; color:var(--gold); }
  .tr-pod-bar{ height:46px; }
  .tr-pod.p1 .tr-pod-bar{ height:80px; }
  .tr-pod.p3 .tr-pod-bar{ height:24px; }
  .tr-table{ display:flex; flex-direction:column; gap:6px; max-width:1200px; margin:0 auto; }
  .tr-row{ display:grid; grid-template-columns:70px 2.2fr 1.4fr 1.3fr 120px; align-items:center; gap:12px; padding:12px 16px; border-radius:14px; background:rgba(235,244,255,.04); border:1px solid rgba(235,244,255,.08); }
  .tr-row.thead{ background:none; border:none; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:rgba(235,244,255,.45); padding-block:4px; }
  .tr-row.top{ border-color:rgba(255,188,58,.3); }
  .tr-row.up{ animation:rowUp 1.6s ease; }
  @keyframes rowUp{ 0%{ background:rgba(64,189,169,.35); } 100%{ background:rgba(235,244,255,.04); } }
  .tr-rank{ font-family:var(--mono); font-weight:700; font-size:18px; color:var(--gold); }
  .tr-name{ font-weight:800; font-size:16px; }
  .tr-dept{ font-size:13px; color:rgba(235,244,255,.55); }
  .tr-prog{ display:flex; gap:4px; }
  .tr-prog i{ width:14px; height:14px; border-radius:4px; background:rgba(235,244,255,.1); }
  .tr-prog i.on{ background:var(--cyan); }
  .tr-pts{ font-family:var(--mono); font-weight:700; font-size:20px; text-align:end; }
  .tr-pts em{ display:block; font-style:normal; font-size:12px; color:var(--cyan); }
  .tr-empty{ text-align:center; color:rgba(235,244,255,.6); }

  @media (max-width:900px){
    .sn-join-grid{ grid-template-columns:1fr; }
    .tr-stages{ grid-template-columns:repeat(2,1fr); }
    .tr-row{ grid-template-columns:44px 1fr 90px; }
    .tr-row .tr-dept, .tr-row .tr-prog{ display:none; }
  }
  @media (max-width:640px){
    .sn-hud{ margin:0 -16px 20px; border-radius:0 0 16px 16px; border-left:none; border-right:none; gap:10px; }
    .sn-hud-stat{ min-width:54px; }
    .sn-hud-stat b{ font-size:16px; }
    .sn-path::before{ inset-inline-start:21px; }
    .sn-node{ width:46px; height:46px; font-size:17px; }
    .sn-stage{ gap:12px; }
    .sn-part{ flex-wrap:wrap; }
    .sn-part .sn-btn{ margin-inline-start:auto; }
    .ar-head{ grid-template-columns:auto 1fr auto; }
    .ar-title b{ font-size:15px; }
    .ar-opts{ grid-template-columns:1fr; }
    .ar-opt{ min-height:62px; padding:14px; font-size:14.5px; }
    .ar-dots span{ width:24px; }
    .pj-progress{ top:62px; }
    .tr-kpis{ grid-template-columns:1fr; }
    .tr-podium{ grid-template-columns:1fr; }
    .tr-pod-bar{ display:none; }
    .tr-pod{ border-radius:20px; border-bottom:1px solid rgba(235,244,255,.12); padding-bottom:16px; }
  }
  /* fixes */
  .app{ overflow-x:clip; }
  .topbar{ margin-bottom:26px; }
  .sn-toast{ transform:translate(-50%,-220%); opacity:0; visibility:hidden; transition:transform .45s cubic-bezier(.2,.9,.3,1.3), opacity .3s, visibility .3s; }
  .sn-toast.show{ transform:translate(-50%,0); opacity:1; visibility:visible; }
  #hudRank, #hudPts, .sn-part-pts, .ar-gain, .ar-break span, .tr-pts, .tr-pts em, .cd-pts, .ar-score b, .tr-stage-c span, .fn-total b, .rs b, .pj-done b, #pjCount{ direction:ltr; unicode-bidi:isolate; }
  .ar-opt.correct{ animation:optWin .45s ease; }
  @keyframes optWin{ 40%{ transform:scale(1.03); } }
  /* co-branding + final v2 */
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand-sep{ width:1px; height:34px; background:rgba(235,244,255,.25); }
  .brand img.brand-sec{ height:48px; width:auto; background:#fff; border-radius:12px; padding:5px 10px; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  .fn-cert, .fn-prompt{ max-width:900px; }
  .fn-cert-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; }
  .fn-cert-head h2, .fn-prompt h2{ margin:0; font-size:22px; font-weight:900; }
  .fn-cert-head .fn-btns{ margin:0; }
  .fn-cert-frame{ position:relative; border-radius:14px; overflow:hidden; background:#F5F1E6; aspect-ratio:2000/1414; box-shadow:0 24px 60px -24px rgba(0,0,0,.7); }
  .fn-cert-frame img{ width:100%; height:100%; display:block; opacity:0; transition:opacity .5s; }
  .fn-cert-frame img.on{ opacity:1; }
  .fn-cert-loading{ position:absolute; inset:0; display:grid; place-items:center; color:#C9921E; animation:blink 1s ease-in-out infinite; }
  .fn-cert .finish-btn{ margin:0; }
  .fn-steps{ margin:14px 0 16px; padding-inline-start:22px; display:flex; flex-direction:column; gap:8px; font-size:14.5px; line-height:1.6; color:rgba(235,244,255,.85); }
  .fn-prompt textarea{ margin-top:14px; }
  @media (max-width:640px){
    .brand{ gap:10px; }
    .brand img.brand-sec{ height:40px; padding:4px 8px; border-radius:10px; }
    .brand-sep{ height:26px; }
    .fn-cert-head .fn-btns{ width:100%; }
    .fn-cert-head .finish-btn{ flex:1; justify-content:center; }
  }
  .fn-steps{ list-style:none; padding:0; }
  .fn-steps li{ position:relative; padding-inline-start:22px; }
  .fn-steps li::before{ content:''; position:absolute; inset-inline-start:2px; top:.6em; width:8px; height:8px; border-radius:50%; background:var(--gold); }

  .fn-kit{ display:flex; gap:14px; align-items:flex-start; background:rgba(255,188,58,.08); border:1px solid rgba(255,188,58,.35); border-radius:16px; padding:16px; margin:14px 0; }
  .fn-kit-imgs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .fn-kit-imgs img{ width:46px; height:46px; object-fit:cover; border-radius:10px; background:#fff; border:1px solid rgba(255,255,255,.2); }
  .fn-kit p{ margin:0; }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">

  <div class="topbar">
    <div class="brand"><img data-img="brand" alt="Skills Bank"><span class="brand-sep"></span><img class="brand-sec" data-img="sec" alt="SEC"></div>
    <div class="topbar-right">
      <div class="top-tag"><span class="dot"></span><span id="topTagText"></span></div>
      <button class="lang-toggle" id="langToggle" onclick="toggleLang()"></button>
    </div>
  </div>

  <div class="sn-hud" id="snHud">
    <div class="sn-hud-me"><span class="sn-av" id="hudAvatar"></span><div><b id="hudName"></b><span id="hudDept"></span></div></div>
    <div class="sn-hud-stat"><span id="hudPtsLabel"></span><b id="hudPts">0</b></div>
    <div class="sn-hud-stat"><span id="hudRankLabel"></span><b id="hudRank">&ndash;</b></div>
    <button class="hud-sound sn-sound-btn" onclick="toggleSound()" aria-label="Sound"></button>
  </div>

  <section class="sn-view" id="v-join"></section>
  <section class="sn-view" id="v-map" hidden></section>
  <section class="sn-view" id="v-opener" hidden>
  <div class="hud" id="hud">
    <div class="hud-cell hud-progress">
      <span class="hud-label" id="hudCasesLabel"></span>
      <span class="hud-val"><span id="hudCases">0</span>/4</span>
      <div class="hud-bar"><div id="hudBarFill"></div></div>
    </div>
    <div class="hud-cell">
      <span class="hud-label" id="hudPointsLabel"></span>
      <span class="hud-val gold" id="hudPoints">0</span>
    </div>
    <div class="hud-cell">
      <span class="hud-label" id="hudTimeLabel"></span>
      <span class="hud-val" id="hudTime">0:00</span>
    </div>
    <button class="hud-sound sn-sound-btn" onclick="toggleSound()" aria-label="Sound"></button>
  </div>

  <div class="intro" id="introView">
    <div class="eyebrow" id="headEyebrow"></div>
    <h1 id="headTitle"></h1>
    <p class="sub" id="headSub"></p>
    <div class="intro-people">
      <div class="avatar"><img data-img="omar" alt=""></div>
      <div class="avatar"><img data-img="layla" alt=""></div>
      <div class="avatar"><img data-img="youssef" alt=""></div>
      <div class="avatar"><img data-img="mona" alt=""></div>
    </div>
    <ul class="intro-rules" id="introRules"></ul>
    <div class="intro-form">
      <button class="finish-btn start-btn" onclick="Opener.startMission()"><span id="startBtnText"></span> <span class="dir-arrow-fwd"></span></button>
    </div>
  </div>

  <div id="mainView" hidden>
    <div class="cases-head">
      <h2 id="casesTitle"></h2>
      <p id="casesSub"></p>
    </div>
    <div class="grid">
      <div class="card c-risk" id="card-omar" onclick="Opener.openCase('omar')" tabindex="0" role="button" aria-label="Omar" onkeydown="if(event.key==='Enter')Opener.openCase('omar')">
        <div class="lock-layer"><span class="lock-ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span class="lock-txt"></span></div>
        <span class="solved-stamp"></span>
        <div class="card-num">01</div>
        <div class="photo-wrap">
          <img class="avatar-svg" data-img="omar" alt="Omar">
          <span class="badge" id="badge1"></span>
        </div>
        <div class="info">
          <div class="name" id="name1"></div>
          <div class="role" id="role1"></div>
          <div class="quote" id="quote1"></div>
          <div class="tap-hint" id="hint1"></div>
        </div>
      </div>
      <div class="card c-motivation" id="card-layla" onclick="Opener.openCase('layla')" tabindex="0" role="button" aria-label="Layla" onkeydown="if(event.key==='Enter')Opener.openCase('layla')">
        <div class="lock-layer"><span class="lock-ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span class="lock-txt"></span></div>
        <span class="solved-stamp"></span>
        <div class="card-num">02</div>
        <div class="photo-wrap">
          <img class="avatar-svg" data-img="layla" alt="Layla">
          <span class="badge" id="badge2"></span>
        </div>
        <div class="info">
          <div class="name" id="name2"></div>
          <div class="role" id="role2"></div>
          <div class="quote" id="quote2"></div>
          <div class="tap-hint" id="hint2"></div>
        </div>
      </div>
      <div class="card c-practice" id="card-youssef" onclick="Opener.openCase('youssef')" tabindex="0" role="button" aria-label="Youssef" onkeydown="if(event.key==='Enter')Opener.openCase('youssef')">
        <div class="lock-layer"><span class="lock-ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span class="lock-txt"></span></div>
        <span class="solved-stamp"></span>
        <div class="card-num">03</div>
        <div class="photo-wrap">
          <img class="avatar-svg" data-img="youssef" alt="Youssef">
          <span class="badge" id="badge3"></span>
        </div>
        <div class="info">
          <div class="name" id="name3"></div>
          <div class="role" id="role3"></div>
          <div class="quote" id="quote3"></div>
          <div class="tap-hint" id="hint3"></div>
        </div>
      </div>
      <div class="card c-social" id="card-mona" onclick="Opener.openCase('mona')" tabindex="0" role="button" aria-label="Mona" onkeydown="if(event.key==='Enter')Opener.openCase('mona')">
        <div class="lock-layer"><span class="lock-ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span class="lock-txt"></span></div>
        <span class="solved-stamp"></span>
        <div class="card-num">04</div>
        <div class="photo-wrap">
          <img class="avatar-svg" data-img="mona" alt="Mona">
          <span class="badge" id="badge4"></span>
        </div>
        <div class="info">
          <div class="name" id="name4"></div>
          <div class="role" id="role4"></div>
          <div class="quote" id="quote4"></div>
          <div class="tap-hint" id="hint4"></div>
        </div>
      </div>

    </div>
    <div class="finish-row">
      <button class="finish-btn" id="finishBtn" onclick="Opener.showFinale()" hidden><span id="finishBtnText"></span> <span class="dir-arrow-fwd"></span></button>
    </div>
  </div>

  <section class="finale" id="finale">
    <button class="finale-back" onclick="Opener.hideFinale()"><span class="dir-arrow-back"></span> <span id="finaleBackText"></span></button>
    <div class="finale-orb o1"></div>
    <div class="finale-orb o2"></div>
    <div class="finale-orb o3"></div>
    <div class="finale-inner">
      <div class="rank-card" id="rankCard">
        <div class="rank-ico" id="rankIco"></div>
        <div class="rank-eyebrow" id="rankEyebrow"></div>
        <div class="rank-title" id="rankTitle"></div>
        <div class="rank-name" id="rankName"></div>
        <div class="rank-stats">
          <div class="rs"><b id="rsPoints">0</b><span id="rsPointsLabel"></span></div>
          <div class="rs"><b id="rsTime">0:00</b><span id="rsTimeLabel"></span></div>
          <div class="rs"><b id="rsAcc">0%</b><span id="rsAccLabel"></span></div>
        </div>
        <div class="rank-share" id="rankShare"></div>
      </div>
      <div class="finale-eyebrow" id="finaleEyebrow"></div>
      <div class="finale-num-wrap">
        <div class="finale-num-ring"></div>
        <div class="finale-num" id="finaleNum">0%</div>
      </div>
      <div class="finale-line" id="finaleLine"></div>
      <p class="finale-sub" id="finaleSub"></p>
      <div class="finale-people">
        <div class="avatar"><img class="avatar-svg" data-img="omar" alt="Omar"></div>
        <div class="avatar"><img class="avatar-svg" data-img="layla" alt="Layla"></div>
        <div class="avatar"><img class="avatar-svg" data-img="youssef" alt="Youssef"></div>
        <div class="avatar"><img class="avatar-svg" data-img="mona" alt="Mona"></div>
      </div>
      <div class="finale-reasons">
        <h3 id="reasonsTitle"></h3>
        <div class="reasons-row" id="reasonsRow"></div>
      </div>
      <div class="finale-principles" id="finalePrinciples">
        <h3 id="principlesTitle"></h3>
        <ul id="principlesList"></ul>
      </div>
      <div class="finale-source" id="finaleSource"></div>
      <div class="again-row">
        <button class="finish-btn" onclick="Opener.leave()"><span id="againText"></span> <span class="dir-arrow-fwd"></span></button>
      </div>
    </div>
  </section>

  <div class="overlay" id="overlay" onclick="if(event.target===this)Opener.closeCase()">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="Opener.closeCase()" aria-label="Close">&times;</button>
      <div class="modal-eyebrow" id="modalEyebrow"></div>
      <span class="modal-badge" id="modalBadge"></span>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-stats" id="modalStats"></div>
      <div class="modal-body" id="modalBody"></div>
      <div id="caseSteps"></div>
    </div>
  </div>

  </section>
  <section class="sn-view" id="v-arena" hidden></section>
  <section class="sn-view" id="v-project" hidden></section>
  <section class="sn-view" id="v-final" hidden></section>
  <section class="sn-view" id="v-trainer" hidden></section>

  <div class="sn-toast" id="snToast" role="status" aria-live="polite"></div>
  <footer>Skills Bank &middot; <span id="footerText"></span></footer>
</div>

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SOUND = { on: true };

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fmtTime(sec){ sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function centerOf(el){ const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function popEl(el){ if (!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function setText(id, v){ const el = document.getElementById(id); if (el) el.textContent = v; }
function setHtml(id, v){ const el = document.getElementById(id); if (el) el.innerHTML = v; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function floatPoints(n, fromEl, isBonus){
  const f = document.createElement('div');
  f.className = 'float-pts' + (isBonus ? ' bonus' : '');
  f.textContent = '+' + n;
  const [x, y] = fromEl ? centerOf(fromEl) : [innerWidth / 2, innerHeight / 2];
  f.style.left = x + 'px'; f.style.top = y + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1200);
}

let AC = null;
function initAudio(){
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){ AC = null; }
}
function beep(freq, dur, type, delay, vol){
  if (!SOUND.on || !AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}

/* ---------- confetti ---------- */
const FX = (() => {
  const c = document.getElementById('fx'), ctx = c.getContext('2d');
  const COLORS = ['#FFBC3A', '#F26444', '#40BDA9', '#4D88E8', '#EBF4FF'];
  let parts = [], raf = null;
  function size(){ const d = window.devicePixelRatio || 1; c.width = innerWidth * d; c.height = innerHeight * d; }
  addEventListener('resize', size); size();
  function add(p){ parts.push(p); if (!raf) raf = requestAnimationFrame(loop); }
  function burst(x, y, n, power){
    if (reduceMotion) return;
    power = power || 1;
    for (let i = 0; i < (n || 50); i++){
      const a = Math.random() * Math.PI * 2, v = (3 + Math.random() * 6) * power;
      add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5 * power, g: .22, s: 5 + Math.random() * 5,
            r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: COLORS[i % COLORS.length], life: 0, max: 80 + Math.random() * 50 });
    }
  }
  function rain(n){
    if (reduceMotion) return;
    for (let i = 0; i < (n || 160); i++){
      add({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 2,
            vy: 2 + Math.random() * 3, g: .04, s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
            c: COLORS[i % COLORS.length], life: 0, max: 280 });
    }
  }
  function loop(){
    const d = window.devicePixelRatio || 1;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
    for (const p of parts){
      p.life++; p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, Math.min(1, (p.max - p.life) / 30));
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .62);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : null;
    if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
  return { burst, rain };
})();

function fieldText(stage, id, data, lang){
  const f = PROJECT[stage].fields.find(x => x.id === id);
  if (!f) return '';
  const v = data[id];
  if (v === undefined || v === null || v === '') return '';
  if (f.type === 'radio') return f.options[v] ? f.options[v][lang] : '';
  if (f.type === 'chips') return (v || []).map(x => typeof x === 'number' ? (f.options[x] ? f.options[x][lang] : '') : x).filter(Boolean).join(lang === 'ar' ? '، ' : ', ');
  return String(v).trim();
}

  add("- Player role: " + t(2, 'role'));

  add("- Core loop: " + t(2, 'loop'));
  add("- Play time: " + t(2, 'duration'));
  add("");
  add("## 4. Game engine (MDA)");
  add("- Mechanics: " + t(3, 'mechanics'));
  add("- Expected dynamics: " + t(3, 'dynamics'));
  add("- Target aesthetics: " + t(3, 'aesthetics'));
  add("- Levels: " + t(3, 'levels') + "; difficulty curve: " + t(3, 'curve'));
  if (B) add("- Decision points:\n" + t(3, 'decisions'));
  if (G) add("- Challenges and missions:\n" + t(3, 'challenges'));
  add("- Rules and scoring: " + t(3, 'rules'));
  add("- Feedback timing: " + t(3, 'feedback'));
  add("- Mastery rewards: " + t(3, 'rewards'));
  add("- If anxiety: " + t(3, 'anxiety') + "; if boredom: " + t(3, 'boredom'));
  add("");
  add("## 5. Debrief, measurement and look");
  add("- Debrief: What? " + t(4, 'what') + " So what? " + t(4, 'sowhat') + " Now what? " + t(4, 'nowwhat'));
  add("- Playtest with: " + t(4, 'playtest'));
  add("- Kirkpatrick 1-2: " + t(4, 'm12') + "; Kirkpatrick 3-4: " + t(4, 'm34'));
  add("- Visual style: " + t(4, 'look') + (d(4).brand ? "; organization and colors: " + d(4).brand : ""));
  add("");
  add("## Game specification");
  add("1. ONE complete HTML file with all HTML, CSS and JavaScript inline. No external libraries; Google Fonts only. Put the whole file in a single code block.");
  add("2. English interface, mobile-first and responsive.");
  add("3. Screens in order: a title screen with the mission story, the player's role and the win condition; player name entry; a level map where levels unlock in sequence; the gameplay screens; a debrief screen with the three questions and text boxes for the player's answers; a final results screen with points, rank title, badges earned, decision accuracy and a replay button.");
  if (B) add("4. Every level is a realistic branching scenario from the audience's real work, built on the decision points above, with dialogue and named characters. Each decision has at least three options, one of them the tempting common mistake. Every option changes what happens next and shows specific feedback explaining why. Mistakes never end the game: the player sees the impact, then tries again.");
  else add("4. Every level is a set of short missions and challenges tied to the target behavior, with applied questions on real work situations and immediate feedback explaining why.");
  add("5. Implement the chosen mechanics exactly: points per the rules above, a streak for consecutive right answers, levels, badges named after the behavior, a countdown timer if it's among the mechanics, and a locally simulated team leaderboard if it's among the mechanics.");
  add("6. Handle flow: a hint button for anxiety and an optional harder bonus challenge for boredom.");
  add("7. Make it feel alive: smooth transitions, a progress bar, floating points when scoring, confetti on success, simple Web Audio sound effects with a mute button, and a gentle shake on wrong choices.");
  add("8. Save the player's progress in localStorage.");
  add("9. Write ALL the content in full: every scene, option and piece of feedback. No placeholder text and nothing like \"add more here\".");
  add("10. After the code block, add a short facilitator guide: timing for the play time above, how to run the game, the debrief questions, a playtest checklist, and the measurement plan.");
  add("");
  add("Before writing the code, silently run the design test on every playful element: if it doesn't serve the target behavior, drop it. If your reply gets cut off because of length, stop at a clean point and I'll reply \"continue\".");
  return lines.join('\n');
}

function kitPath(f){ return 'images/' + f.k + '.' + KIT[f.k].ext; }
function buildAssetsSection(lang){
  const L = [];
  if (lang === 'ar'){
    L.push('ملحق إلزامي: صور اللعبة');
    L.push('يوجد بجوار ملف اللعبة مجلد باسم images يحتوي على الصور التالية، وقد أرفقتها لك أيضًا. استخدمها كلها داخل اللعبة بمساراتها النسبية كما هي تمامًا:');
    KIT_FILES.forEach(f => L.push('- ' + kitPath(f) + ': ' + f.ar));
    L.push('قواعد استخدام الصور:');
    L.push('- اكتب المسارات حرفيًا، مثل <img src="images/mentor.jpg">، ولا تحوّل الصور إلى base64، ولا تستبدلها بروابط خارجية أو برسوم بديلة.');
    L.push('- استخدم object-fit: cover للصور، وضع طبقة تدرّج داكنة فوق صور الخلفية حتى يبقى النص واضحًا.');
    L.push('- أضف معالجة onerror تُخفي أي صورة لا تُحمّل، حتى لا تظهر أيقونة صورة مكسورة.');
    L.push('- إن لم يُحدَّد شكل بصري آخر أعلاه، فاعتمد ألوان شعار السعودية للطاقة: الأزرق والأخضر المتدرّج على خلفية فاتحة أو كحلية.');
  } else {
    L.push('## Mandatory appendix: game images');
    L.push('Next to the game file there is a folder named images containing the files below (I have attached them as well). Use ALL of them in the game, with these exact relative paths:');
    KIT_FILES.forEach(f => L.push('- ' + kitPath(f) + ': ' + f.en));
    L.push('Image rules:');
    L.push('- Write the paths literally, e.g. <img src="images/mentor.jpg">. Do NOT convert images to base64, and do not replace them with external URLs or placeholder art.');
    L.push('- Use object-fit: cover, and put a dark gradient overlay on background photos so text stays readable.');
    L.push('- Add an onerror handler that hides any image that fails to load, so no broken-image icon ever shows.');
    L.push('- Unless a different visual style is specified above, use the SEC logo colours: its blue-to-green gradient on a light or navy background.');
  }
  return L.join('\n');
}
function buildFullPrompt(P, lang){
  return buildPrompt(P, lang) + '\n\n' + buildAssetsSection(lang);
}

/* ===================== OPENER: THE FOUR CASES (stage 0) ===================== */
const Opener = (() => {
  const CASES = ['omar', 'layla', 'youssef', 'mona'];
  const GAP_OF = { omar: 'risk', layla: 'motivation', youssef: 'practice', mona: 'social' };
  const GAPS = ['risk', 'motivation', 'practice', 'social'];
  const PTS = [100, 50, 20];
  const SPEED_WINDOW = 150, SPEED_MAX = 50;

  let lang = 'ar', currentCase = null, onDone = null;
  const G = { started: false, startTs: 0, endTs: 0, points: 0, name: '', timer: null, finaleShown: false };
  const CS = {};
  function resetState(){
    G.started = false; G.startTs = 0; G.endTs = 0; G.points = 0; G.finaleShown = false;
    CASES.forEach(k => {
      CS[k] = { opened: 0, diagTries: 0, diagDone: false, diagWrong: [], diagOrder: null,
                solTries: 0, solDone: false, solWrong: [], solOrder: null, lastSol: null, pts: 0, speed: 0 };
    });
  }
  resetState();

  const $ = id => document.getElementById(id);
  function ptsFor(tries){ return PTS[Math.min(tries - 1, PTS.length - 1)]; }
  function solvedCount(){ let n = 0; for (const k of CASES){ if (CS[k].solDone) n++; else break; } return n; }
  function gapLabel(gap, l){ const person = CASES.find(k => GAP_OF[k] === gap); return OTR[l].cards[CASES.indexOf(person)].badge; }
  function elapsed(){ if (!G.started) return 0; return ((G.endTs || Date.now()) - G.startTs) / 1000; }

  function updateHud(){
    const n = solvedCount();
    $('hudCases').textContent = n;
    $('hudBarFill').style.width = (n / CASES.length * 100) + '%';
    $('hudPoints').textContent = G.points;
    $('hudTime').textContent = fmtTime(elapsed());
  }
  function addPoints(n, fromEl, isBonus){
    if (!n) return;
    G.points += n;
    floatPoints(n, fromEl, isBonus);
    updateHud();
    popEl($('hudPoints'));
  }

  function enter(name, l, done){
    onDone = done; G.name = name || '';
    resetState();
    $('introView').hidden = false;
    $('mainView').hidden = true;
    $('hud').classList.remove('on');
    $('finale').classList.remove('show', 'in-view');
    $('mainView').classList.remove('hiding');
    setLang(l);
  }

  function startMission(){
    if (G.started) return;
    initAudio();
    G.started = true;
    G.startTs = Date.now();
    $('introView').hidden = true;
    $('mainView').hidden = false;
    $('hud').classList.add('on');
    G.timer = setInterval(updateHud, 1000);
    renderCards(); updateHud();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    SFX.solve();
    setTimeout(() => { const el = $('card-' + CASES[0]); if (el){ const [x, y] = centerOf(el); FX.burst(x, y, 40, .8); } }, 250);
  }

  function renderCards(){
    const t = OTR[lang], done = solvedCount();
    CASES.forEach((k, i) => {
      const card = $('card-' + k), n = i + 1, st = CS[k];
      const locked = i > done, active = i === done && !st.solDone;
      card.classList.toggle('locked', locked);
      card.classList.toggle('active', active);
      card.classList.toggle('solved', st.solDone);
      card.setAttribute('aria-disabled', locked ? 'true' : 'false');
      $('badge' + n).textContent = st.diagDone ? t.cards[i].badge : '?';
      $('name' + n).textContent = t.cards[i].name;
      $('role' + n).textContent = t.cards[i].role;
      $('quote' + n).textContent = t.cards[i].quote;
      $('hint' + n).textContent = locked ? t.hintLocked : (st.solDone ? t.hintSolved : t.hintOpen);
      card.querySelector('.lock-txt').textContent = t.locked;
      card.querySelector('.solved-stamp').textContent = t.solvedStamp;
      card.setAttribute('aria-label', t.cards[i].name + ' — ' + (locked ? t.locked : t.hintOpen));
    });
    $('finishBtn').hidden = done < CASES.length;
  }

  function openCase(k){
    if (!G.started) return;
    const idx = CASES.indexOf(k);
    if (idx > solvedCount()){
      const card = $('card-' + k);
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      SFX.locked();
      return;
    }
    const st = CS[k];
    if (!st.opened) st.opened = Date.now();
    if (!st.diagOrder) st.diagOrder = shuffle(GAPS);
    if (!st.solOrder) st.solOrder = shuffle([0, 1, 2]);
    currentCase = k;
    renderCase();
    $('overlay').classList.add('show');
    $('modal').scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }

  function closeCase(){
    $('overlay').classList.remove('show');
    document.body.style.overflow = '';
    currentCase = null;
  }

  function renderCase(){
    const k = currentCase; if (!k) return;
    const t = OTR[lang], s = STORIES[k], loc = s[lang], st = CS[k], idx = CASES.indexOf(k);
    $('modalEyebrow').textContent = t.caseOf(idx + 1);
    const badge = $('modalBadge');
    if (st.diagDone){
      badge.textContent = loc.badgeText;
      badge.className = 'modal-badge';
      badge.style.color = '#' + s.badgeColor;
      badge.style.border = '1px solid #' + s.badgeColor + '66';
    } else {
      badge.textContent = t.unknownGap;
      badge.className = 'modal-badge unknown';
      badge.style.color = ''; badge.style.border = '';
    }
    $('modalTitle').textContent = loc.title;
    $('modalStats').innerHTML =
      '<div class="modal-stat ms-test"><div class="ms-label">' + t.statTest + '</div><div class="ms-val">' + loc.score + '</div></div>' +
      '<div class="modal-stat ms-field"><div class="ms-label">' + t.statField + '</div><div class="ms-val">' + loc.field + '</div></div>';
    $('modalBody').textContent = loc.body;
    renderSteps();
  }

  function renderSteps(){
    const k = currentCase, t = OTR[lang], st = CS[k];
    let h = '';
    h += '<div class="step' + (st.diagDone ? ' done' : '') + '" id="step1">';
    h += '<div class="step-head"><span class="step-num">' + (st.diagDone ? ICON('check') : '1') + '</span><span>' + t.step1Q + '</span></div>';
    h += '<div class="opts gaps">';
    st.diagOrder.forEach(g => {
      let cls = 'opt', dis = st.diagDone;
      if (st.diagWrong.includes(g)){ cls += ' wrong'; dis = true; }
      if (st.diagDone && g === GAP_OF[k]) cls += ' correct';
      h += '<button type="button" class="' + cls + '" data-gap="' + g + '"' + (dis ? ' disabled' : '') + '>' + gapLabel(g, lang) + '</button>';
    });
    h += '</div>';
    if (st.diagDone) h += '<div class="fb">' + t.diagRight(gapLabel(GAP_OF[k], lang)) + '</div>';
    else if (st.diagWrong.length) h += '<div class="fb bad">' + HINTS[k][lang] + '</div>';
    h += '</div>';

    if (st.diagDone){
      const opts = REFLECT[k][lang];
      h += '<div class="step' + (st.solDone ? ' done' : '') + '" id="step2">';
      h += '<div class="step-head"><span class="step-num">' + (st.solDone ? ICON('check') : '2') + '</span><span>' + REFLECT_Q[lang] + '</span></div>';
      h += '<div class="opts">';
      st.solOrder.forEach(i => {
        let cls = 'opt', dis = st.solDone;
        if (st.solWrong.includes(i)){ cls += ' wrong'; dis = true; }
        if (st.solDone && opts[i].ok) cls += ' correct';
        h += '<button type="button" class="' + cls + '" data-sol="' + i + '"' + (dis ? ' disabled' : '') + '>' + opts[i].t + '</button>';
      });
      h += '</div>';
      if (st.lastSol !== null){
        const o = opts[st.lastSol];
        h += '<div class="fb' + (o.ok ? '' : ' bad') + '">' + o.fb + '</div>';
      }
      h += '</div>';
    }

    if (st.solDone){
      const last = CASES.indexOf(k) === CASES.length - 1;
      h += '<div class="case-closing">' + STORIES[k][lang].closing + '</div>';
      h += '<div class="play-fix show"><span class="pf-label">' + PLAY_FIX.label[lang] + '</span><span class="pf-val">' + PLAY_FIX[k][lang] + '</span></div>';
      h += '<div class="case-done"><div class="cd-label">' + t.caseDone + '</div>';
      h += '<div class="cd-pts">' + st.pts + '</div>';
      h += '<div class="cd-bonus">' + (st.speed ? t.speedBonus(st.speed) : '') + '</div>';
      h += '<button type="button" class="finish-btn" id="nextBtn"><span>' + (last ? t.revealRank : t.nextCase) + '</span> <span class="dir-arrow-fwd"></span></button>';
      h += '</div>';
    }

    const box = $('caseSteps');
    box.innerHTML = h;
    box.querySelectorAll('[data-gap]').forEach(b => b.addEventListener('click', () => pickDiag(b.dataset.gap, b)));
    box.querySelectorAll('[data-sol]').forEach(b => b.addEventListener('click', () => pickSol(parseInt(b.dataset.sol, 10), b)));
    const nb = $('nextBtn');
    if (nb) nb.addEventListener('click', goNext);
  }

  function scrollModalTo(id){
    const el = $(id), m = $('modal');
    if (!el) return;
    setTimeout(() => m.scrollTo({ top: el.offsetTop - 20, behavior: reduceMotion ? 'auto' : 'smooth' }), 80);
  }

  function pickDiag(gap, btn){
    const k = currentCase, st = CS[k];
    if (st.diagDone) return;
    st.diagTries++;
    if (gap === GAP_OF[k]){
      st.diagDone = true;
      const gain = ptsFor(st.diagTries);
      st.pts += gain;
      SFX.correct();
      const [x, y] = centerOf(btn); FX.burst(x, y, 28, .6);
      addPoints(gain, btn);
      renderCase(); renderCards();
      scrollModalTo('step2');
    } else {
      st.diagWrong.push(gap);
      SFX.wrong();
      renderSteps();
      const nb = document.querySelector('[data-gap="' + gap + '"]');
      if (nb) nb.classList.add('shake');
    }
  }

  function pickSol(i, btn){
    const k = currentCase, st = CS[k];
    if (st.solDone) return;
    st.solTries++;
    st.lastSol = i;
    const opt = REFLECT[k][lang][i];
    if (opt.ok){
      st.solDone = true;
      const gain = ptsFor(st.solTries);
      st.pts += gain;
      const [x, y] = centerOf(btn);
      addPoints(gain, btn);
      const secs = (Date.now() - st.opened) / 1000;
      const bonus = Math.round(SPEED_MAX * Math.max(0, 1 - secs / SPEED_WINDOW));
      if (bonus > 0){
        st.speed = bonus; st.pts += bonus;
        setTimeout(() => { addPoints(bonus, btn, true); SFX.bonus(); }, 450);
      }
      SFX.solve();
      FX.burst(x, y, 90, 1.1);
      if (solvedCount() === CASES.length) G.endTs = Date.now();
      renderSteps(); renderCards(); updateHud();
      scrollModalTo('step2');
    } else {
      st.solWrong.push(i);
      SFX.wrong();
      renderSteps();
      const nb = document.querySelector('[data-sol="' + i + '"]');
      if (nb) nb.classList.add('shake');
    }
  }

  function goNext(){
    const idx = CASES.indexOf(currentCase);
    closeCase();
    if (idx === CASES.length - 1){ showFinale(); return; }
    const next = CASES[idx + 1], card = $('card-' + next);
    card.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    setTimeout(() => {
      card.classList.remove('unlocking'); void card.offsetWidth; card.classList.add('unlocking');
      const [x, y] = centerOf(card); FX.burst(x, y, 50, .9);
      SFX.solve();
    }, 450);
  }

  function rankFor(p){ return RANKS.find(r => p >= r.min); }
  function fillFinale(){
    const t = OTR[lang], r = rankFor(G.points);
    let first = 0; CASES.forEach(k => { if (CS[k].diagTries === 1) first++; if (CS[k].solTries === 1) first++; });
    $('rankIco').innerHTML = ICON(r.ico);
    $('rankEyebrow').textContent = t.rankEyebrow;
    $('rankTitle').textContent = r[lang];
    $('rankName').textContent = G.name;
    $('rsPoints').textContent = G.points;
    $('rsTime').textContent = fmtTime(elapsed());
    $('rsAcc').textContent = Math.round(first / (CASES.length * 2) * 100) + '%';
    $('rsPointsLabel').textContent = t.rsPoints;
    $('rsTimeLabel').textContent = t.rsTime;
    $('rsAccLabel').textContent = t.rsAcc;
    $('rankShare').textContent = t.rankShare;
  }

  function animateCount(target, duration){
    const el = $('finaleNum'), start = performance.now();
    function tick(now){
      const p = Math.min((now - start) / duration, 1), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(eased * target) + '%';
      if (p < 1) requestAnimationFrame(tick); else el.textContent = target + '%';
    }
    requestAnimationFrame(tick);
  }

  function showFinale(){
    if (solvedCount() < CASES.length) return;
    if (!G.endTs) G.endTs = Date.now();
    clearInterval(G.timer); updateHud();
    fillFinale();
    const fin = $('finale');
    $('mainView').classList.add('hiding');
    fin.classList.add('show');
    fin.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    fin.classList.remove('in-view');
    $('finaleNum').textContent = '0%';
    requestAnimationFrame(() => {
      fin.classList.add('in-view');
      setTimeout(() => animateCount(70, 1400), 750);
    });
    if (!G.finaleShown){
      SFX.fanfare(); FX.rain(180);
      if (onDone) onDone(G.points);
    } else FX.rain(60);
    G.finaleShown = true;
  }

  function hideFinale(){
    $('finale').classList.remove('show');
    $('mainView').classList.remove('hiding');
    document.body.style.overflow = '';
  }

  function leave(){
    hideFinale(); closeCase();
    clearInterval(G.timer);
    if (window.SN) SN.go('map');
  }

  function setLang(l){
    lang = l;
    const t = OTR[l];
    setText('headEyebrow', t.headEyebrow);
    setHtml('headTitle', t.headTitle);
    setText('headSub', t.headSub);
    setHtml('introRules', t.rules.map(r => '<li><span class="ri">' + ICON(r[0]) + '</span><span>' + r[1] + '</span></li>').join(''));
    setText('startBtnText', t.startBtn);
    setText('hudCasesLabel', t.hudCases);
    setText('hudPointsLabel', t.hudPoints);
    setText('hudTimeLabel', t.hudTime);
    setText('casesTitle', t.casesTitle);
    setText('casesSub', t.casesSub);
    setText('finishBtnText', t.finishBtn);
    setText('finaleEyebrow', t.finaleEyebrow);
    setHtml('finaleLine', t.finaleLine);
    setText('finaleSub', t.finaleSub);
    setText('finaleSource', t.finaleSource);
    setText('finaleBackText', t.finaleBack);
    setText('againText', t.again);
    setText('principlesTitle', t.principlesTitle);
    setHtml('principlesList', t.principlesList.map(li => '<li><span>✦</span> <span>' + li + '</span></li>').join(''));
    setText('reasonsTitle', REASONS.title[l]);
    setHtml('reasonsRow', REASONS.items.map((k, i) =>
      '<div class="reason-tile r' + (i + 1) + '"><div class="rt-title">' + PLAY_FIX[k][l] + '</div><div class="rt-who">' + t.cards[CASES.indexOf(k)].name + '</div></div>'
    ).join(''));
    renderCards();
    if (currentCase) renderCase();
    if ($('finale').classList.contains('show')) fillFinale();
  }

  function onEscape(){
    if ($('overlay').classList.contains('show')){ closeCase(); return true; }
    if ($('finale').classList.contains('show')){ hideFinale(); return true; }
    return false;
  }

  return { enter, startMission, openCase, closeCase, showFinale, hideFinale, leave, setLang, onEscape };
})();

/* ===================== TRAINER SCREEN ===================== */
const Trainer = (() => {
  let code = '', pin = '', authed = false, stage = 0, board = [], prev = {}, timer = null, busy = false;
  const PARTS = ['s0', 's1a', 's1b', 's2a', 's2b', 's3a', 's3b', 's4a', 's4b'];
  try { code = sessionStorage.getItem('sn_tcode') || ''; pin = sessionStorage.getItem('sn_tpin') || ''; } catch(e){}

  function box(){ return document.getElementById('v-trainer'); }
  function render(){
    if (!code) code = SESSION;
    if (!authed && pin && !busy){ busy = true; tryLogin(code, pin, true); return; }
    authed ? renderDash() : renderLogin();
  }

  function renderLogin(err){
    const t = T[LANG].tr;
    box().innerHTML =
      '<form class="sn-card tr-login" id="trForm" autocomplete="off">' +
        '<div class="ar-emblem">' + ICON('crown', 40) + '</div>' +
        '<h2>' + esc(t.title) + '</h2>' +
        '<label class="sn-label" for="trCode">' + esc(t.code) + '</label>' +
        '<input class="sn-input" id="trCode" value="' + esc(code) + '">' +
        '<label class="sn-label" for="trPin">' + esc(t.pin) + '</label>' +
        '<input class="sn-input" id="trPin" type="password" value="">' +
        '<div class="sn-err">' + (err ? esc(t.errPin) : '') + '</div>' +
        '<button class="finish-btn" type="submit"><span>' + esc(t.login) + '</span> <span class="dir-arrow-fwd"></span></button>' +
        (API.online ? '' : '<div class="sn-demo">' + esc(t.offline) + '</div>') +
      '</form>';
    document.getElementById('trForm').addEventListener('submit', e => {
      e.preventDefault();
      tryLogin(document.getElementById('trCode').value.trim(), document.getElementById('trPin').value.trim(), false);
    });
  }

  async function tryLogin(c, p, silent){
    try {
      const ok = await API.checkPin(c, p);
      busy = false;
      if (!ok){ pin = ''; if (!silent) SFX.locked(); renderLogin(!silent); return; }
      code = c; pin = p; authed = true;
      try { sessionStorage.setItem('sn_tcode', c); sessionStorage.setItem('sn_tpin', p); } catch(e){}
      initAudio();
      await poll();
      clearInterval(timer); timer = setInterval(poll, 3000);
    } catch(e){ busy = false; renderLogin(!silent); }
  }

  async function poll(){
    try {

/* ===================== BACKEND ===================== */
const API = (() => {
  if (ONLINE){
    const base = CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/';
    const KEY = CONFIG.SUPABASE_ANON_KEY.trim();
    async function rpc(fn, args){
      const r = await fetch(base + fn, {
        method: 'POST',
        headers: Object.assign({ apikey: KEY, 'Content-Type': 'application/json' }, KEY.indexOf('eyJ') === 0 ? { Authorization: 'Bearer ' + KEY } : {}),
        body: JSON.stringify(args || {})
      });
      if (!r.ok) throw new Error(fn + ' ' + r.status);
      const txt = await r.text();
      return txt ? JSON.parse(txt) : null;
    }
    return {
      online: true,
      getStage: (c) => rpc('sn_get_stage', { p_code: c }),
      join: (c, p) => rpc('sn_join', { p_code: c, p_id: p.id, p_secret: p.secret, p_name: p.name, p_dept: p.dept }),
      save: (p, total) => rpc('sn_save', { p_id: p.id, p_secret: p.secret, p_total: total, p_scores: p.scores, p_project: projectPayload(p) }),
      board: (c) => rpc('sn_leaderboard', { p_code: c }),
      checkPin: (c, pin) => rpc('sn_check_pin', { p_code: c, p_pin: pin }),
      setStage: (c, pin, s) => rpc('sn_set_stage', { p_code: c, p_pin: pin, p_stage: s }),
      reset: (c, pin) => rpc('sn_reset', { p_code: c, p_pin: pin })
    };
  }
  const KEY = 'sn_local_db';
  function db(){ try { return JSON.parse(localStorage.getItem(KEY)) || { sessions: {}, players: {} }; } catch(e){ return { sessions: {}, players: {} }; } }
  function put(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  function ensure(d, c){ if (!d.sessions[c]) d.sessions[c] = { stage: 0, pin: CONFIG.LOCAL_PIN }; return d.sessions[c]; }
  const wait = (v) => new Promise(r => setTimeout(() => r(v), 60));
  return {
    online: false,
    getStage: (c) => { const d = db(); const s = ensure(d, c); put(d); return wait(s.stage); },
    join: (c, p) => { const d = db(); ensure(d, c);
      const ex = d.players[p.id];
      if (ex && ex.secret !== p.secret) return wait(false);
      d.players[p.id] = Object.assign(ex || { total: 0, scores: {}, created: Date.now() }, { id: p.id, secret: p.secret, session: c, full_name: p.name, department: p.dept, updated: Date.now() });
      put(d); return wait(true); },
    save: (p, total) => { const d = db(); const ex = d.players[p.id];
      if (!ex || ex.secret !== p.secret) return wait(false);
      ex.total = total; ex.scores = p.scores; ex.updated = Date.now(); put(d); return wait(true); },
    board: (c) => { const d = db();
      const list = Object.values(d.players).filter(x => x.session === c)
        .map(x => ({ id: x.id, full_name: x.full_name, department: x.department, total: x.total || 0, scores: x.scores || {}, updated: x.updated }))
        .sort((a, b) => (b.total - a.total) || (a.updated - b.updated));
      return wait(list); },
    checkPin: (c, pin) => { const d = db(); const s = ensure(d, c); put(d); return wait(s.pin === pin); },
    setStage: (c, pin, st) => { const d = db(); const s = ensure(d, c); if (s.pin !== pin) return wait(false); s.stage = st; put(d); return wait(true); },
    reset: (c, pin) => { const d = db(); const s = ensure(d, c); if (s.pin !== pin) return wait(false);
      Object.keys(d.players).forEach(k => { if (d.players[k].session === c) delete d.players[k]; }); put(d); return wait(true); }
  };
})();

  return out;
}

  else { setTimerDisplay(answered.t != null ? Math.max(0, ARENA_TIME - answered.t) : 0); }

function setTimerDisplay(remain){
  const f = document.getElementById('arFill'), sec = document.getElementById('arSecs');
  if (!f) return;
  f.style.width = (remain / ARENA_TIME * 100) + '%';
  f.classList.toggle('warn', remain <= 10);
  f.classList.toggle('crit', remain <= 5);
  sec.textContent = Math.ceil(remain);
}
function startTimer(s){
  const A = P.arena[s];
  clearInterval(arenaTimer);
  let lastSec = null;
  const tick = () => {
    const el = (Date.now() - A.qStart) / 1000, remain = Math.max(0, ARENA_TIME - el);
    setTimerDisplay(remain);
    const sec = Math.ceil(remain);
    if (sec !== lastSec && sec <= 5 && sec > 0) SFX.tick();
    lastSec = sec;
    if (remain <= 0){ clearInterval(arenaTimer); answer(s, -1, null); }
  };
  tick();
  arenaTimer = setInterval(tick, 100);
}
function answer(s, oi, btn){
  const A = P.arena[s], i = A.idx;
  if (A.answers[i]) return;
  clearInterval(arenaTimer);
  const el = Math.min(ARENA_TIME, (Date.now() - A.qStart) / 1000);
  const ok = oi === 0;
  let base = 0, speed = 0, streakB = 0;
  if (ok){
    base = 100;
    speed = Math.round(100 * Math.max(0, ARENA_TIME - el) / ARENA_TIME);
    A.streak++;
    A.best = Math.max(A.best, A.streak);
    streakB = A.streak >= 2 ? Math.min(60, (A.streak - 1) * 20) : 0;
  } else A.streak = 0;
  const pts = base + speed + streakB;
  A.answers[i] = { pick: oi, ok, pts, base, speed, streakB, t: Math.round(el * 10) / 10 };
  P.scores['s' + s + 'a'] = arenaScore(A);
  queueSave();
  if (ok){
    SFX.correct();
    const target = btn || document.querySelector('.ar-opt[data-oi="0"]');
    if (target){ const [x, y] = centerOf(target); FX.burst(x, y, 40 + A.streak * 10, .8); floatPoints(pts, target, false); }
  } else SFX.wrong();
  renderQuestion(s);
  bumpHud();
  const sc = document.getElementById('arScore'); popEl(sc);
}
function revealHtml(s, i, a){
  const t = T[LANG], Q = QUESTIONS[s][i], last = i === QUESTIONS[s].length - 1;
  let h = '<div class="ar-reveal ' + (a.ok ? 'good' : 'bad') + '">';
  h += '<div class="ar-verdict">' + ICON(a.ok ? 'check' : 'clock', 22) + '<b>' + esc(a.ok ? t.correct : (a.pick === -1 ? t.timeUp : t.wrong)) + '</b>';
  h += '<span class="ar-gain">+' + a.pts + '</span></div>';
  if (a.ok){
    h += '<div class="ar-break"><span>' + esc(t.ptsBase) + ' +' + a.base + '</span><span>' + esc(t.ptsSpeed) + ' +' + a.speed + '</span>' + (a.streakB ? '<span class="hot">' + esc(t.ptsStreak) + ' +' + a.streakB + '</span>' : '') + '</div>';
  }
  h += '<p class="ar-why">' + esc(Q.why[LANG]) + '</p>';
  h += '<button class="finish-btn" id="arNext"><span>' + esc(last ? t.seeResult : t.nextQ) + '</span> <span class="dir-arrow-fwd"></span></button>';
  h += '</div>';

}
function bindReveal(s){
