/* ===================== PROJECT ===================== */
function projCtx(s){
  const d = P.project[s].data;
  const ctx = Object.assign({}, d);
  ctx._approach = P.project[2] ? P.project[2].data.approach : undefined;
  return ctx;
}
function isShown(f, ctx){ return !f.show || f.show(ctx); }
function isReq(f, ctx){ return typeof f.req === 'function' ? f.req(ctx) : !!f.req; }
function filled(f, v){
  if (f.type === 'radio') return v !== undefined && v !== null;
  if (f.type === 'chips') return Array.isArray(v) && v.length > 0;
  return typeof v === 'string' && v.trim().length > 0;
}
function reqStats(s){
  const ctx = projCtx(s); let need = 0, have = 0;
  PROJECT[s].fields.forEach(f => {
    if (f.type === 'recommend' || !isShown(f, ctx) || !isReq(f, ctx)) return;
    need++; if (filled(f, P.project[s].data[f.id])) have++;
  });
  return { need, have };
}
function recommendation(d){
  const ids = ['c_obj', 'c_budget', 'c_complex', 'c_context'];
  if (ids.some(k => d[k] === undefined)) return null;
  const b = ids.filter(k => d[k] === 1).length;
  return b >= 3 ? 1 : (b <= 1 ? 0 : 2);
}
function renderProject(){
  const s = curStage, t = T[LANG], m = STAGE_META[s][LANG], box = document.getElementById('v-project');
  const PR = P.project[s], ctx = projCtx(s);
  let h = '<div class="pj-head"><button class="sn-back" data-back><span class="dir-arrow-back"></span> ' + esc(t.toMap) + '</button>';
  h += '<div class="eyebrow">' + esc(stageLabel(s) + ' · ' + t.projectWord) + '</div>';
  h += '<h1 class="pj-title">' + esc(m.b) + '</h1>';
  h += '<p class="sn-muted">' + esc(PROJECT[s].intro[LANG]) + '</p>';
  if (s > 1 && P.project[1].data.topic) h += '<div class="pj-chip-proj">' + ICON('flag', 16) + '<span>' + esc(P.project[1].data.topic) + '</span></div>';
  h += '</div>';
  h += '<div class="pj-progress"><div class="pj-bar"><div id="pjFill"></div></div><span id="pjCount"></span><span class="pj-saved">' + ICON('check', 14) + esc(t.autosave) + '</span></div>';
  h += '<div class="pj-fields">';
  PROJECT[s].fields.forEach(f => {
    if (!isShown(f, ctx)) return;
    h += fieldHtml(s, f, PR.data, ctx);
  });
  h += '</div>';
  h += '<div class="pj-foot">';
  if (PR.done) h += '<div class="pj-done">' + ICON('check', 18) + '<span>' + esc(t.completedNote) + '</span><b>+' + (P.scores['s' + s + 'b'] || 0) + '</b></div><button class="sn-btn ghost" data-back>' + esc(t.toMap) + '</button>';
  else h += '<button class="finish-btn" id="pjComplete" disabled><span>' + esc(t.complete) + '</span> <span class="dir-arrow-fwd"></span></button>';
  h += '</div>';
  box.innerHTML = h;
  bindBack(box);
  bindFields(s, box);
  updateProjProgress(s);
  const cb = document.getElementById('pjComplete');
  if (cb) cb.addEventListener('click', () => completeProject(s, cb));
}
function fieldHtml(s, f, d, ctx){
  const t = T[LANG], req = isReq(f, ctx), v = d[f.id];
  if (f.type === 'recommend'){
    const r = recommendation(d);
    const txt = r === null ? t.recNone : [t.recG, t.recB, t.recX][r];
    return '<div class="pj-rec' + (r === null ? '' : ' on') + '"><div class="pj-rec-ico">' + ICON('compass', 26) + '</div><div><span class="pj-rec-t">' + esc(t.recTitle) + '</span><b>' + esc(txt) + '</b>' + (r === null ? '' : '<small>' + esc(t.recNote) + '</small>') + '</div></div>';
  }
  let h = '<div class="pj-field' + (filled(f, v) ? ' ok' : '') + '" data-fid="' + f.id + '">';
  h += '<label class="pj-label"><span class="pj-check">' + ICON('check', 12) + '</span>' + esc(f.label[LANG]) + (req ? ' <em>*</em>' : '') + '</label>';
  if (f.hint) h += '<div class="pj-hint">' + esc(f.hint[LANG]) + '</div>';
  if (f.type === 'text'){
    h += '<input class="sn-input" data-in="' + f.id + '" value="' + esc(v || '') + '" maxlength="300">';
  } else if (f.type === 'textarea'){
    h += '<textarea class="sn-input" rows="3" data-in="' + f.id + '" maxlength="1500">' + esc(v || '') + '</textarea>';
  } else if (f.type === 'radio'){
    h += '<div class="pj-radios">' + f.options.map((o, i) => '<button type="button" class="pj-radio' + (v === i ? ' on' : '') + '" data-radio="' + f.id + '" data-i="' + i + '"><span class="pj-dot"></span><span>' + esc(o[LANG]) + '</span></button>').join('') + '</div>';
  } else if (f.type === 'chips'){
    const arr = Array.isArray(v) ? v : [];
    if (f.max) h += '<div class="pj-hint">' + esc(t.maxPick(f.max)) + '</div>';
    h += '<div class="pj-chips">';
    f.options.forEach((o, i) => { h += '<button type="button" class="pj-chip' + (arr.includes(i) ? ' on' : '') + '" data-chip="' + f.id + '" data-i="' + i + '">' + ICON(arr.includes(i) ? 'check' : 'star', 14) + '<span>' + esc(o[LANG]) + '</span></button>'; });
    arr.filter(x => typeof x === 'string').forEach(x => { h += '<button type="button" class="pj-chip on own" data-chipown="' + f.id + '" data-v="' + esc(x) + '">' + ICON('check', 14) + '<span>' + esc(x) + '</span></button>'; });
    h += '</div>';
    h += '<div class="pj-own"><input class="sn-input" data-ownin="' + f.id + '" placeholder="' + esc(t.addOwn) + '" maxlength="80"><button type="button" class="sn-btn ghost" data-ownadd="' + f.id + '">' + esc(t.add) + '</button></div>';
  }
  if ((f.type === 'text' || f.type === 'textarea') && (f.helpers || f.tpl)){
    h += '<div class="pj-helpers"><span class="pj-helpers-t">' + ICON('rocket', 14) + esc(t.helpers) + '</span>';
    if (f.tpl) h += '<button type="button" class="pj-help tpl" data-tpl="' + f.id + '">' + ICON('edit', 13) + esc(t.useTpl) + '</button>';
    (f.helpers || []).forEach((hp, i) => { h += '<button type="button" class="pj-help" data-help="' + f.id + '" data-i="' + i + '">' + esc(hp[LANG]) + '</button>'; });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function fieldDef(s, id){ return PROJECT[s].fields.find(f => f.id === id); }
function bindFields(s, box){
  const d = P.project[s].data;
  box.querySelectorAll('[data-in]').forEach(el => el.addEventListener('input', () => {
    d[el.dataset.in] = el.value; queueSave(); markField(el.dataset.in, s); updateProjProgress(s);
  }));
  box.querySelectorAll('[data-radio]').forEach(el => el.addEventListener('click', () => {
    d[el.dataset.radio] = parseInt(el.dataset.i, 10); queueSave(); SFX.tick(); rerenderProject();
  }));
  box.querySelectorAll('[data-chip]').forEach(el => el.addEventListener('click', () => {
    const f = fieldDef(s, el.dataset.chip), i = parseInt(el.dataset.i, 10);
    let arr = Array.isArray(d[f.id]) ? d[f.id].slice() : [];
    if (arr.includes(i)) arr = arr.filter(x => x !== i);
    else { if (f.max && arr.length >= f.max){ SFX.locked(); el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); return; } arr.push(i); }
    d[f.id] = arr; queueSave(); SFX.tick(); rerenderProject();
  }));
  box.querySelectorAll('[data-chipown]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.chipown; d[id] = (d[id] || []).filter(x => x !== el.dataset.v); queueSave(); rerenderProject();
  }));
  box.querySelectorAll('[data-ownadd]').forEach(el => el.addEventListener('click', () => addOwn(s, el.dataset.ownadd)));
  box.querySelectorAll('[data-ownin]').forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addOwn(s, el.dataset.ownin); } }));
  box.querySelectorAll('[data-help]').forEach(el => el.addEventListener('click', () => {
    const f = fieldDef(s, el.dataset.help), txt = f.helpers[parseInt(el.dataset.i, 10)][LANG];
    const input = box.querySelector('[data-in="' + f.id + '"]');
    if (f.type === 'text') input.value = txt;
    else input.value = input.value.trim() ? input.value.trim() + '\n' + txt : txt;
    d[f.id] = input.value; queueSave(); markField(f.id, s); updateProjProgress(s); SFX.tick();
    el.classList.add('used');
  }));
  box.querySelectorAll('[data-tpl]').forEach(el => el.addEventListener('click', () => {
    const f = fieldDef(s, el.dataset.tpl), input = box.querySelector('[data-in="' + f.id + '"]');
    input.value = input.value.trim() ? input.value.trim() + '\n' + f.tpl[LANG] : f.tpl[LANG];
    d[f.id] = input.value; queueSave(); markField(f.id, s); updateProjProgress(s); input.focus(); SFX.tick();
  }));
}
function addOwn(s, id){
  const input = document.querySelector('[data-ownin="' + id + '"]');
  const v = (input.value || '').trim(); if (!v) return;
  const f = fieldDef(s, id), d = P.project[s].data;
  const arr = Array.isArray(d[id]) ? d[id].slice() : [];
  if (f.max && arr.length >= f.max){ SFX.locked(); return; }
  if (!arr.includes(v)) arr.push(v);
  d[id] = arr; queueSave(); SFX.tick(); rerenderProject();
}
function rerenderProject(){
  const y = window.scrollY;
  renderProject();
  window.scrollTo({ top: y });
}
function markField(id, s){
  const el = document.querySelector('.pj-field[data-fid="' + id + '"]');
  if (el) el.classList.toggle('ok', filled(fieldDef(s, id), P.project[s].data[id]));
}
function updateProjProgress(s){
  const { need, have } = reqStats(s), t = T[LANG];
  const f = document.getElementById('pjFill'); if (!f) return;
  f.style.width = (need ? have / need * 100 : 100) + '%';
  setText('pjCount', t.reqProgress(have, need));
  const cb = document.getElementById('pjComplete');
  if (cb) cb.disabled = have < need;
}
function completeProject(s, btn){
  const { need, have } = reqStats(s);
  if (have < need) return;
  const PR = P.project[s];
  if (PR.done) return;
  PR.done = true;
  P.scores['s' + s + 'b'] = PROJECT_POINTS;
  queueSave();
  const [x, y] = centerOf(btn);
  floatPoints(PROJECT_POINTS, btn, false);
  FX.burst(x, y, 120, 1.2); SFX.solve();
  if (allProjectsDone()){ setTimeout(() => { SFX.fanfare(); FX.rain(200); }, 500); }
  bumpHud();
  setTimeout(() => { refreshBoard(); SN.go(allProjectsDone() ? 'final' : 'map'); }, 1100);
}

  h += '<button class="sn-btn ghost" id="fnCopy">' + ICON('copy', 16) + '<span>' + esc(t.copy) + '</span></button>';
  h += '<a class="sn-btn ghost" href="https://claude.ai/new" target="_blank" rel="noopener">' + ICON('external', 16) + esc(t.openClaude) + '</a>';
  h += '<a class="sn-btn ghost" href="https://chatgpt.com/" target="_blank" rel="noopener">' + ICON('external', 16) + esc(t.openGPT) + '</a></div>';
  h += '<textarea readonly id="fnPrompt" rows="12">' + esc(prompt) + '</textarea>';
  h += '</div>';
  box.innerHTML = h;
  bindBack(box);
  document.getElementById('fnCopy').addEventListener('click', copyPrompt);
  document.getElementById('fnKit').addEventListener('click', downloadKit);
  box.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', () => downloadCert(b.dataset.dl)));
  const cv = document.getElementById('certCanvas');
  drawCertificate(cv).then(() => {
    const img = document.getElementById('certImg');
    if (img){ img.src = cv.toDataURL('image/png'); img.classList.add('on'); }
    const ld = document.getElementById('certLoading'); if (ld) ld.remove();
  });
}
/* ---- Game kit ZIP (stored, no compression) ---- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC_T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dd = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  files.forEach(f => {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(10, dt, true); lh.setUint16(12, dd, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(12, dt, true); ch.setUint16(14, dd, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + sz;
  });
  const cd = central.reduce((a, b) => a + b.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cd, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
function txtBytes(str){ const b = new TextEncoder().encode(str.replace(/\r?\n/g, '\r\n')), o = new Uint8Array(b.length + 3); o.set([0xEF, 0xBB, 0xBF]); o.set(b, 3); return o; }
function b64Bytes(b){ const s = atob(b), o = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; }
function downloadKit(){
  const t = T[LANG], btn = document.getElementById('fnKit'), root = 'Game-Kit/';
  const files = [
    { name: root + 'PROMPT.txt', data: txtBytes(buildFullPrompt(P, LANG)) },
    { name: root + (LANG === 'ar' ? 'README-AR.txt' : 'README.txt'), data: txtBytes(buildKitReadme(LANG)) }
  ].concat(KIT_FILES.map(f => ({ name: root + kitPath(f), data: b64Bytes(KIT[f.k].b64) })));
  const url = URL.createObjectURL(makeZip(files)), a = document.createElement('a');
  a.href = url; a.download = 'Game-Kit-' + P.name.replace(/\s+/g, '-') + '.zip';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  btn.querySelector('span').textContent = t.kitDone;
  SFX.correct(); const [x, y] = centerOf(btn); FX.burst(x, y, 40, .7);
  setTimeout(() => { btn.querySelector('span').textContent = t.downloadKit; }, 2600);
}
async function copyPrompt(){
  const t = T[LANG], ta = document.getElementById('fnPrompt'), btn = document.getElementById('fnCopy');
  try { await navigator.clipboard.writeText(ta.value); }
  catch(e){ ta.focus(); ta.select(); try { document.execCommand('copy'); } catch(_){} }
  btn.querySelector('span').textContent = t.copied;
  SFX.correct(); const [x, y] = centerOf(btn); FX.burst(x, y, 30, .6);
  setTimeout(() => { btn.querySelector('span').textContent = t.copy; }, 2200);
}
function loadImg(src){ return new Promise(res => { if (!src){ res(null); return; } const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
function tinted(img, color){
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return c;
}
function certId(){ return 'SN-' + String(P.id || '').replace(/-/g, '').slice(0, 8).toUpperCase(); }

async function drawCertificate(cv){
  const t = T[LANG], c = t.cert, ctx = cv.getContext('2d'), W = cv.width, H = cv.height, AR = LANG === 'ar';
  const fam = AR ? 'Tajawal, sans-serif' : 'Poppins, sans-serif';
  const NAVY = '#0B1F5C', INK = '#1B2347', MUTED = '#5B6380', GOLD = '#C9921E', GOLD2 = '#FFBC3A';
  try { await Promise.all(['900 100px', '800 60px', '700 40px', '500 40px'].map(w => document.fonts.load(w + ' ' + (AR ? 'Tajawal' : 'Poppins')))); await document.fonts.load('800 30px Poppins'); } catch(e){}
  const [sb, sec] = await Promise.all([loadImg(IMGS.brand), loadImg(IMGS.sec)]);
  const dir = AR ? 'rtl' : 'ltr';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // paper
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#FFFFFF'); bg.addColorStop(1, '#F5F1E6');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // soft corner glows
  const glow = (x, y, r, col) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  glow(0, 0, 700, 'rgba(77,136,232,.10)'); glow(W, H, 800, 'rgba(255,188,58,.14)');
  // watermark hexagon
  ctx.save(); ctx.globalAlpha = .045; ctx.fillStyle = NAVY; hexPath(ctx, W / 2, H / 2 + 40, 520); ctx.fill(); ctx.restore();

  // frame
  ctx.strokeStyle = NAVY; ctx.lineWidth = 18; ctx.strokeRect(45, 45, W - 90, H - 90);
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.strokeRect(82, 82, W - 164, H - 164);
  ctx.fillStyle = GOLD;
  [[82, 82, 1, 1], [W - 82, 82, -1, 1], [82, H - 82, 1, -1], [W - 82, H - 82, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.fillRect(x, y, 90 * sx, 10 * sy); ctx.fillRect(x, y, 10 * sx, 90 * sy);
    ctx.save(); ctx.translate(x + 34 * sx, y + 34 * sy); ctx.rotate(Math.PI / 4); ctx.fillRect(-9, -9, 18, 18); ctx.restore();
  });

  // logos row
  const LH = 118, LY = 150;
  const sbImg = sb ? tinted(sb, NAVY) : null;
  if (sbImg){ const h2 = 92, w = sbImg.width * (h2 / sbImg.height); ctx.drawImage(sbImg, AR ? W - 190 - w : 190, LY + (LH - h2) / 2, w, h2); }
  if (sec){ const w = sec.width * (LH / sec.height); ctx.drawImage(sec, AR ? 190 : W - 190 - w, LY, w, LH); }

  ctx.direction = dir; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // eyebrow + title
  ctx.fillStyle = GOLD; ctx.font = '700 30px ' + fam;
  ctx.fillText(c.eyebrow, W / 2, 380);
  ctx.fillStyle = NAVY; ctx.font = '900 92px ' + fam;
  ctx.fillText(AR ? c.heading : c.heading.toUpperCase(), W / 2, 478);
  // divider with diamond
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W / 2 - 260, 520); ctx.lineTo(W / 2 - 22, 520); ctx.moveTo(W / 2 + 22, 520); ctx.lineTo(W / 2 + 260, 520); ctx.stroke();
  ctx.save(); ctx.translate(W / 2, 520); ctx.rotate(Math.PI / 4); ctx.fillStyle = GOLD; ctx.fillRect(-9, -9, 18, 18); ctx.restore();

  ctx.fillStyle = MUTED; ctx.font = '500 40px ' + fam; ctx.fillText(c.certifies, W / 2, 598);
  // name
  let fs = 110; ctx.font = '900 ' + fs + 'px ' + fam;
  while (ctx.measureText(P.name).width > W - 520 && fs > 60){ fs -= 4; ctx.font = '900 ' + fs + 'px ' + fam; }
  ctx.fillStyle = INK; ctx.fillText(P.name, W / 2, 728);
  const nw = Math.min(W - 520, ctx.measureText(P.name).width + 120);
  const ug = ctx.createLinearGradient(W / 2 - nw / 2, 0, W / 2 + nw / 2, 0); ug.addColorStop(0, 'rgba(201,146,30,0)'); ug.addColorStop(.5, GOLD); ug.addColorStop(1, 'rgba(201,146,30,0)');
  ctx.fillStyle = ug; ctx.fillRect(W / 2 - nw / 2, 758, nw, 4);
  ctx.fillStyle = MUTED; ctx.font = '500 40px ' + fam; ctx.fillText(c.from + ' ' + P.dept, W / 2, 828);
  ctx.fillStyle = INK; ctx.font = '500 40px ' + fam; ctx.fillText(c.completed, W / 2, 906);
  // program title
  fs = 56; ctx.font = '800 ' + fs + 'px ' + fam;
  const ttl = AR ? '«' + PROGRAM_TITLE.ar + '»' : '“' + PROGRAM_TITLE.en + '”';
  while (ctx.measureText(ttl).width > W - 420 && fs > 34){ fs -= 2; ctx.font = '800 ' + fs + 'px ' + fam; }
  ctx.fillStyle = GOLD; ctx.fillText(ttl, W / 2, 990);
  ctx.fillStyle = INK; ctx.font = '500 40px ' + fam; ctx.fillText(c.earned, W / 2, 1064);

  // badge
  drawBadge(ctx, W / 2, 1196, 92, NAVY, GOLD2);

  // footer: date (start side) and signature (end side)
  const dateStr = new Date().toLocaleDateString(AR ? 'ar-SA-u-ca-gregory-nu-latn' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
  const startX = AR ? W - 230 : 230, endX = AR ? 230 : W - 230;
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(11,31,92,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(startX - 170, 1236); ctx.lineTo(startX + 170, 1236); ctx.moveTo(endX - 170, 1236); ctx.lineTo(endX + 170, 1236); ctx.stroke();
  ctx.fillStyle = INK; ctx.font = '700 36px ' + fam; ctx.fillText(dateStr, startX, 1220);
  ctx.fillStyle = MUTED; ctx.font = '500 28px ' + fam; ctx.fillText(c.date, startX, 1276);
  ctx.fillStyle = NAVY; ctx.font = '800 38px ' + fam; ctx.fillText(c.issuer, endX, 1220);
  ctx.fillStyle = MUTED; ctx.font = '500 28px ' + fam; ctx.fillText(c.issuerRole, endX, 1276);
  // certificate id
  ctx.direction = 'ltr'; ctx.fillStyle = 'rgba(91,99,128,.75)'; ctx.font = '600 22px Poppins, sans-serif';
  ctx.fillText(certId(), endX, 1316);
  ctx.direction = dir;
}
function hexPath(ctx, x, y, r){
  ctx.beginPath();
  for (let i = 0; i < 6; i++){ const a = Math.PI / 3 * i - Math.PI / 2; const px = x + r * Math.cos(a), py = y + r * Math.sin(a); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath();
}
function drawBadge(ctx, x, y, R, NAVY, GOLD){
  ctx.save();
  // ribbons
  ctx.fillStyle = NAVY;
  ctx.beginPath(); ctx.moveTo(x - 60, y + 40); ctx.lineTo(x - 92, y + 132); ctx.lineTo(x - 62, y + 118); ctx.lineTo(x - 46, y + 146); ctx.lineTo(x - 18, y + 58); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 60, y + 40); ctx.lineTo(x + 92, y + 132); ctx.lineTo(x + 62, y + 118); ctx.lineTo(x + 46, y + 146); ctx.lineTo(x + 18, y + 58); ctx.closePath(); ctx.fill();
  // medal
  hexPath(ctx, x, y, R);
  const g = ctx.createLinearGradient(x, y - R, x, y + R); g.addColorStop(0, '#FFE39A'); g.addColorStop(.5, GOLD); g.addColorStop(1, '#C8871A');
  ctx.shadowColor = 'rgba(201,146,30,.45)'; ctx.shadowBlur = 30; ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  ctx.lineWidth = 6; ctx.strokeStyle = NAVY; ctx.stroke();
  hexPath(ctx, x, y, R - 16); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(11,31,92,.45)'; ctx.stroke();
  // star
  ctx.fillStyle = NAVY; ctx.beginPath();
  for (let i = 0; i < 10; i++){ const r = i % 2 ? 17 : 40, a = Math.PI / 5 * i - Math.PI / 2; const px = x + r * Math.cos(a), py = y - 16 + r * Math.sin(a); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath(); ctx.fill();
  ctx.direction = 'ltr'; ctx.textAlign = 'center'; ctx.font = '800 17px Poppins, sans-serif'; ctx.fillText('GAME ENABLER', x, y + 44); ctx.fillText('EXPERT', x, y + 66);
  ctx.restore();
}
function downloadCert(kind){
  const cv = document.getElementById('certCanvas');
  const base = 'GameEnablerExpert-' + P.name.replace(/\s+/g, '-');
  const url = cv.toDataURL('image/png');
  if (kind === 'pdf'){
    const w = window.open('', '_blank');
    if (!w){ location.href = url; return; }
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(base) + '</title><style>@page{size:A4 landscape;margin:0}html,body{margin:0;background:#fff}img{width:100%;height:auto;display:block}</style></head><body><img src="' + url + '" onload="setTimeout(function(){window.print()},300)"></body></html>');
    w.document.close();
  } else {
    const a = document.createElement('a'); a.href = url; a.download = base + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  }
  SFX.solve();
}

/* ===================== POLLING ===================== */
async function pollStage(){
  if (!P || IS_TRAINER) return;
  try {
    const s = await API.getStage(SESSION);
    if (typeof s === 'number' && s !== STAGE){
      const up = s > STAGE;
      STAGE = s;
      if (up){ SFX.unlock(); FX.rain(90); toast(T[LANG].unlockedToast(s)); }
      if (VIEW === 'map') renderMap();
    }
  } catch(e){}
}
async function refreshBoard(){
  if (!P || IS_TRAINER) return;
  try {
    const b = await API.board(SESSION);
    if (Array.isArray(b)){
      BOARD = b; renderHud();
      const rr = document.getElementById('resRank'); if (rr){ const r = myRank(); rr.textContent = r ? '#' + r : '–'; }
    }
  } catch(e){}
}

/* ===================== LANGUAGE ===================== */
function applyLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.title = T[l].appName + ' · ' + T[l].appSub;
  setText('langToggle', T[l].langToggle);
  setText('topTagText', IS_TRAINER ? T[l].tr.title : T[l].tag);
  setText('footerText', T[l].appName + ' · ' + PROGRAM_TITLE[l]);
  try { localStorage.setItem('sn_lang', l); } catch(e){}
  if (VIEW === 'opener') Opener.setLang(l);
  render();
}
function toggleLang(){ applyLang(LANG === 'ar' ? 'en' : 'ar'); }

window.addEventListener('hashchange', () => {
  const wantTrainer = location.hash.toLowerCase().indexOf('trainer') >= 0 || QS.has('trainer');
  if (wantTrainer !== IS_TRAINER) location.reload();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && VIEW === 'opener') Opener.onEscape();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && P) { storeP(); API.save(P, total()).catch(() => {}); } });

/* ===================== BOOT ===================== */
(function boot(){
  try { const l = localStorage.getItem('sn_lang'); if (l === 'en' || l === 'ar') LANG = l; } catch(e){}
  applyImages();
  renderSoundBtns();
  if (IS_TRAINER){
    applyLang(LANG);
    SN.go('trainer');
    return;
  }
  P = loadP();
  if (P && P.session === SESSION){
    API.getStage(SESSION).then(s => { if (typeof s === 'number') STAGE = s; if (VIEW === 'map') renderMap(); }).catch(() => {});
    API.join(SESSION, P).catch(() => {});
    applyLang(LANG);
    SN.go('map');
    refreshBoard();
  } else {
    P = null;
    applyLang(LANG);
    SN.go('join');
  }
  setInterval(pollStage, 4000);
  setInterval(refreshBoard, 10000);
})();
