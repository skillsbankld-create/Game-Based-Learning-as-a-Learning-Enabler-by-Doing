/* ---------- SETTINGS: paste your Supabase details here ---------- */
const CONFIG = {
  SUPABASE_URL: '',          // e.g. https://abcdxyz.supabase.co
  SUPABASE_ANON_KEY: '',     // the "anon public" key
  SESSION: 'SEC-GBL',        // default session code (participants can use ?s=CODE)
  LOCAL_PIN: 'SEC-GBL'          // trainer PIN in demo mode only
};
const SEC_LOGO = '';         // optional: paste a data:image/png;base64,... SEC logo here

const ARENA_TIME = 30;       // seconds per question
const PROJECT_POINTS = 300;
const QS = new URLSearchParams(location.search);
const SESSION = (QS.get('s') || CONFIG.SESSION).trim();
const ONLINE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const IS_TRAINER = location.hash.toLowerCase().indexOf('trainer') >= 0 || QS.has('trainer');

/* ===================== BACKEND ===================== */
const API = (() => {
  if (ONLINE){
    const base = CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/';
    const KEY = CONFIG.SUPABASE_ANON_KEY;
    async function rpc(fn, args){
      const r = await fetch(base + fn, {
        method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(args || {})
      });
      if (!r.ok) throw new Error(fn + ' ' + r.status);
      const txt = await r.text();
      return txt ? JSON.parse(txt) : null;
    }
    return {
      online: true,
      getStage: (c) => rpc('sn_get_stage', { p_code: c }),
      join: (c, p) => rpc('sn_join', { p_code: c, p_id: p.id, p_secret: p.secret, p_name: p.name, p_dept: p.dept }),
      save: (p, total) => rpc('sn_save', { p_id: p.id, p_secret: p.secret, p_total: total, p_scores: p.scores, p_project: projectPayload(p) }),
      board: (c) => rpc('sn_leaderboard', { p_code: c }),
      checkPin: (c, pin) => rpc('sn_check_pin', { p_code: c, p_pin: pin }),
      setStage: (c, pin, s) => rpc('sn_set_stage', { p_code: c, p_pin: pin, p_stage: s }),
      reset: (c, pin) => rpc('sn_reset', { p_code: c, p_pin: pin })
    };
  }
  const KEY = 'sn_local_db';
  function db(){ try { return JSON.parse(localStorage.getItem(KEY)) || { sessions: {}, players: {} }; } catch(e){ return { sessions: {}, players: {} }; } }
  function put(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  function ensure(d, c){ if (!d.sessions[c]) d.sessions[c] = { stage: 0, pin: CONFIG.LOCAL_PIN }; return d.sessions[c]; }
  const wait = (v) => new Promise(r => setTimeout(() => r(v), 60));
  return {
    online: false,
    getStage: (c) => { const d = db(); const s = ensure(d, c); put(d); return wait(s.stage); },
    join: (c, p) => { const d = db(); ensure(d, c);
      const ex = d.players[p.id];
      if (ex && ex.secret !== p.secret) return wait(false);
      d.players[p.id] = Object.assign(ex || { total: 0, scores: {}, created: Date.now() }, { id: p.id, secret: p.secret, session: c, full_name: p.name, department: p.dept, updated: Date.now() });
      put(d); return wait(true); },
    save: (p, total) => { const d = db(); const ex = d.players[p.id];
      if (!ex || ex.secret !== p.secret) return wait(false);
      ex.total = total; ex.scores = p.scores; ex.updated = Date.now(); put(d); return wait(true); },
    board: (c) => { const d = db();
      const list = Object.values(d.players).filter(x => x.session === c)
        .map(x => ({ id: x.id, full_name: x.full_name, department: x.department, total: x.total || 0, scores: x.scores || {}, updated: x.updated }))
        .sort((a, b) => (b.total - a.total) || (a.updated - b.updated));
      return wait(list); },
    checkPin: (c, pin) => { const d = db(); const s = ensure(d, c); put(d); return wait(s.pin === pin); },
    setStage: (c, pin, st) => { const d = db(); const s = ensure(d, c); if (s.pin !== pin) return wait(false); s.stage = st; put(d); return wait(true); },
    reset: (c, pin) => { const d = db(); const s = ensure(d, c); if (s.pin !== pin) return wait(false);
      Object.keys(d.players).forEach(k => { if (d.players[k].session === c) delete d.players[k]; }); put(d); return wait(true); }
  };
})();

function projectPayload(p){
  const out = {};
  for (let s = 1; s <= 4; s++) if (p.project[s]) out[s] = { done: !!p.project[s].done, data: p.project[s].data };
  return out;
}

function stageLabel(s){ return LANG === 'ar' ? 'المرحلة ' + ORD.ar[s] : (s === 0 ? 'Opener' : 'Stage ' + s); }

/* ===================== STATE ===================== */
const PKEY = 'sn_player_' + SESSION;
let P = null;
let LANG = 'ar';
let STAGE = 0;
let BOARD = [];
let VIEW = 'join';
let curStage = 1;
let arenaTimer = null;

function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
}
function newPlayer(name, dept){
  const p = { v: 1, id: uuid(), secret: uuid() + uuid(), session: SESSION, name, dept, scores: {}, opener: { done: false }, arena: {}, project: {} };
  for (let s = 1; s <= 4; s++){
    p.arena[s] = { order: null, idx: 0, answers: [], streak: 0, best: 0, started: false, done: false, qStart: 0 };
    p.project[s] = { data: {}, done: false };
  }
  return p;
}
function loadP(){ try { return JSON.parse(localStorage.getItem(PKEY)); } catch(e){ return null; } }
function storeP(){ try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch(e){} }
function total(){ return Object.values(P.scores).reduce((a, b) => a + (b || 0), 0); }
let saveTimer = null;
function queueSave(){
  storeP();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { API.save(P, total()).catch(() => {}); }, 700);
}
function myRank(){ const i = BOARD.findIndex(x => x.id === (P && P.id)); return i < 0 ? null : i + 1; }
function allProjectsDone(){ for (let s = 1; s <= 4; s++) if (!P.project[s].done) return false; return true; }

/* ===================== IMAGES ===================== */
function applyImages(root){
  (root || document).querySelectorAll('img[data-img]').forEach(im => { if (IMGS[im.dataset.img]) im.src = IMGS[im.dataset.img]; });
}

/* ===================== ROUTER ===================== */
const VIEWS = ['join', 'map', 'opener', 'arena', 'project', 'final', 'trainer'];
const SN = {
  go(v, s){
    VIEW = v;
    if (s !== undefined) curStage = s;
    clearInterval(arenaTimer);
    VIEWS.forEach(x => { const el = document.getElementById('v-' + x); if (el) el.hidden = x !== v; });
    const showHud = ['map', 'arena', 'project', 'final'].includes(v);
    document.getElementById('snHud').classList.toggle('on', showHud);
    document.body.classList.toggle('in-opener', v === 'opener');
    document.body.classList.toggle('in-trainer', v === 'trainer');
    render();
    window.scrollTo({ top: 0 });
  }
};
window.SN = SN;

function render(){
  renderHud();
  if (VIEW === 'join') renderJoin();
  else if (VIEW === 'map') renderMap();
  else if (VIEW === 'arena') renderArena();
  else if (VIEW === 'project') renderProject();
  else if (VIEW === 'final') renderFinal();
  else if (VIEW === 'trainer') Trainer.render();
}

/* ===================== TOPBAR / HUD ===================== */
function initials(name){
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  return ((parts[0] || '')[0] || '') + ((parts[1] || '')[0] || '');
}
function renderHud(){
  if (!P) return;
  const t = T[LANG], r = myRank();
  setText('hudAvatar', initials(P.name));
  setText('hudName', P.name);
  setText('hudDept', P.dept);
  setText('hudPtsLabel', t.hudPoints);
  setText('hudRankLabel', t.hudRank);
  setText('hudPts', total());
  setText('hudRank', r ? ('#' + r + ' / ' + BOARD.length) : '–');
}
function bumpHud(){ renderHud(); popEl(document.getElementById('hudPts')); }

function toast(msg){
  const el = document.getElementById('snToast');
  el.innerHTML = ICON('rocket', 20) + '<span>' + esc(msg) + '</span>';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 4200);
}

/* ===================== JOIN ===================== */
function renderJoin(){
  const t = T[LANG];
  const box = document.getElementById('v-join');
  box.innerHTML =
    '<div class="sn-hero">' +
      '<div class="eyebrow">' + esc(t.tag) + '</div>' +
      '<h1 class="sn-title">' + esc(t.appName) + '<span>' + esc(t.appSub) + '</span></h1>' +
      '<div class="intro-people">' + ['omar', 'layla', 'youssef', 'mona'].map(k => '<div class="avatar"><img data-img="' + k + '" alt=""></div>').join('') + '</div>' +
    '</div>' +
    '<div class="sn-join-grid">' +
      '<ul class="intro-rules">' + t.joinRules.map(r => '<li><span class="ri">' + ICON(r[0]) + '</span><span>' + esc(r[1]) + '</span></li>').join('') + '</ul>' +
      '<form class="sn-card sn-join-form" id="joinForm" autocomplete="off">' +
        '<h2>' + esc(t.joinTitle) + '</h2><p class="sn-muted">' + esc(t.joinSub) + '</p>' +
        '<label class="sn-label" for="jName">' + esc(t.name) + '</label>' +
        '<input class="sn-input" id="jName" maxlength="80" placeholder="' + esc(t.namePh) + '" value="' + esc(P ? P.name : '') + '">' +
        '<label class="sn-label" for="jDept">' + esc(t.dept) + '</label>' +
        '<input class="sn-input" id="jDept" maxlength="80" placeholder="' + esc(t.deptPh) + '" value="' + esc(P ? P.dept : '') + '">' +
        '<div class="sn-err" id="jErr"></div>' +
        '<button class="finish-btn start-btn" type="submit"><span>' + esc(t.joinBtn) + '</span> <span class="dir-arrow-fwd"></span></button>' +
        (API.online ? '' : '<div class="sn-demo">' + esc(t.offline) + '</div>') +
      '</form>' +
    '</div>';
  applyImages(box);
  document.getElementById('joinForm').addEventListener('submit', onJoin);
}
async function onJoin(e){
  e.preventDefault();
  const t = T[LANG];
  const name = document.getElementById('jName').value.trim().replace(/\s+/g, ' ');
  const dept = document.getElementById('jDept').value.trim().replace(/\s+/g, ' ');
  const err = document.getElementById('jErr');
  if (name.split(' ').length < 3){ err.textContent = t.errName; SFX.locked(); return; }
  if (!dept){ err.textContent = t.errDept; SFX.locked(); return; }
  initAudio();
  const btn = e.target.querySelector('button'); btn.disabled = true;
  if (!P) P = newPlayer(name, dept); else { P.name = name; P.dept = dept; }
  try {
    const stage = await API.getStage(SESSION);
    if (stage === null || stage === undefined) throw new Error('no session');
    const ok = await API.join(SESSION, P);
    if (!ok) throw new Error('join refused');
    STAGE = stage;
    storeP();
    await API.save(P, total()).catch(() => {});
    SFX.unlock();
    SN.go('map');
    refreshBoard();
  } catch(ex){
    err.textContent = t.errSession;
    btn.disabled = false;
  }
}

/* ===================== MAP ===================== */
function stageState(s){
  if (s === 0) return { open: true, aDone: P.opener.done, bDone: true };
  return { open: s <= STAGE, aDone: P.arena[s].done, bDone: P.project[s].done };
}
function renderMap(){
  const t = T[LANG], box = document.getElementById('v-map');
  let h = '<div class="sn-head"><h2>' + esc(t.mapTitle) + '</h2><p>' + esc(t.mapSub) + '</p></div>';
  h += '<div class="sn-path">';
  for (let s = 0; s <= 4; s++){
    const st = stageState(s), m = STAGE_META[s][LANG];
    const full = st.aDone && st.bDone;
    const cls = 'sn-stage' + (st.open ? '' : ' locked') + (full ? ' complete' : '') + (st.open && !full ? ' current' : '');
    h += '<div class="' + cls + '">';
    h += '<div class="sn-node">' + (full ? ICON('check', 22) : (st.open ? '<b>' + s + '</b>' : ICON('lock', 20))) + '</div>';
    h += '<div class="sn-stage-body">';
    h += '<div class="sn-stage-top"><span class="sn-stage-ord">' + esc(stageLabel(s)) + '</span><span class="sn-stage-mod">' + esc(m.module) + '</span></div>';
    if (!st.open){
      h += '<div class="sn-locked-msg">' + ICON('lock', 16) + '<span>' + esc(t.lockedAfter) + '</span><span class="sn-wait-dot"></span></div>';
    } else if (s === 0){
      h += partRow('opener', 0, 'search', m.title, m.a, st.aDone, P.scores.s0, true);
    } else {
      h += partRow('arena', s, 'bolt', t.partA, m.title, st.aDone, P.scores['s' + s + 'a'], true, P.arena[s].started && !st.aDone);
      h += partRow('project', s, 'edit', t.partB, m.b, st.bDone, P.scores['s' + s + 'b'], st.aDone, false, !st.aDone ? t.needA : '');
    }
    h += '</div></div>';
  }
  const ready = allProjectsDone();
  h += '<div class="sn-stage final' + (ready ? ' current' : ' locked') + '">';
  h += '<div class="sn-node">' + ICON('award', 22) + '</div><div class="sn-stage-body">';
  h += '<div class="sn-stage-top"><span class="sn-stage-ord">' + esc(t.finalCard) + '</span></div>';
  h += '<p class="sn-muted">' + esc(ready ? t.finalCardReady : t.finalCardSub) + '</p>';
  if (ready) h += '<button class="finish-btn" data-go="final"><span>' + esc(t.finalBtn) + '</span> <span class="dir-arrow-fwd"></span></button>';
  h += '</div></div>';
  h += '</div>';
  box.innerHTML = h;
  box.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.go, s = parseInt(b.dataset.s || '0', 10);
    if (v === 'opener'){ SN.go('opener'); Opener.enter(P.name, LANG, onOpenerDone); }
    else SN.go(v, s);
  }));
}
function partRow(view, s, ico, label, title, done, pts, enabled, inProgress, note){
  const t = T[LANG];
  let h = '<div class="sn-part' + (done ? ' done' : '') + (enabled ? '' : ' off') + '">';
  h += '<span class="sn-part-ico">' + ICON(done ? 'check' : ico, 18) + '</span>';
  h += '<div class="sn-part-txt"><span class="sn-part-label">' + esc(label) + '</span><span class="sn-part-title">' + esc(title) + '</span>' + (note ? '<span class="sn-part-note">' + esc(note) + '</span>' : '') + '</div>';
  if (done) h += '<span class="sn-part-pts">+' + (pts || 0) + '</span>';
  if (enabled){
    const lbl = done ? t.review : (inProgress ? t.resume : t.start);
    if (!(view === 'opener' && done)) h += '<button class="sn-btn' + (done ? ' ghost' : '') + '" data-go="' + view + '" data-s="' + s + '">' + esc(lbl) + '</button>';
  }
  h += '</div>';
  return h;
}
function onOpenerDone(points){
  if (P.opener.done) return;
  P.opener.done = true;
  P.scores.s0 = points;
  queueSave(); renderHud();
  setTimeout(refreshBoard, 900);
}

/* ===================== ARENA ===================== */
const SHAPES = ['tri', 'dia', 'cir', 'sq'];
function shapeSvg(k){
  const p = { tri: '<path d="M12 4l9 16H3z"/>', dia: '<path d="M12 2l10 10-10 10L2 12z"/>', cir: '<circle cx="12" cy="12" r="9"/>', sq: '<rect x="4" y="4" width="16" height="16" rx="2"/>' }[k];
  return '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + p + '</svg>';
}
function arenaState(s){
  const A = P.arena[s];
  if (!A.order) A.order = QUESTIONS[s].map(() => shuffle([0, 1, 2, 3]));
  return A;
}
function arenaScore(A){ return A.answers.reduce((a, x) => a + (x.pts || 0), 0); }

function renderArena(){
  const s = curStage, A = arenaState(s);
  if (!A.started) return renderArenaIntro(s);
  if (A.done) return renderArenaResult(s);
  renderQuestion(s);
}
function arenaHeader(s, A){
  const t = T[LANG], m = STAGE_META[s][LANG], n = QUESTIONS[s].length;
  let h = '<div class="ar-head"><button class="sn-back" data-back>' + '<span class="dir-arrow-back"></span> ' + esc(t.toMap) + '</button>';
  h += '<div class="ar-title"><span>' + esc(stageLabel(s)) + '</span><b>' + esc(m.title) + '</b></div>';
  h += '<div class="ar-score">' + ICON('star', 16) + '<b id="arScore">' + arenaScore(A) + '</b></div></div>';
  h += '<div class="ar-dots">';
  for (let i = 0; i < n; i++){
    const a = A.answers[i];
    h += '<span class="' + (a ? (a.ok ? 'ok' : 'no') : (i === A.idx && A.started && !A.done ? 'cur' : '')) + '"></span>';
  }
  h += '</div>';
  return h;
}
function bindBack(box){ box.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => SN.go('map'))); }

function renderArenaIntro(s){
  const t = T[LANG], m = STAGE_META[s][LANG], box = document.getElementById('v-arena');
  box.innerHTML =
    '<div class="ar-intro">' +
      '<button class="sn-back" data-back><span class="dir-arrow-back"></span> ' + esc(t.toMap) + '</button>' +
      '<div class="ar-emblem">' + ICON('bolt', 44) + '</div>' +
      '<div class="eyebrow">' + esc(stageLabel(s) + ' · ' + m.module) + '</div>' +
      '<h1 class="ar-big">' + esc(m.title) + '</h1>' +
      '<p class="sn-muted">' + esc(QCOUNT[LANG][QUESTIONS[s].length]) + '</p>' +
      '<div class="intro-people">' + ['omar', 'layla', 'youssef', 'mona'].map(k => '<div class="avatar"><img data-img="' + k + '" alt=""></div>').join('') + '</div>' +
      '<ul class="intro-rules">' + t.arenaRules.map(r => '<li><span class="ri">' + ICON(r[0]) + '</span><span>' + esc(r[1]) + '</span></li>').join('') + '</ul>' +
      '<button class="finish-btn start-btn" id="arStart"><span>' + esc(t.enterArena) + '</span> <span class="dir-arrow-fwd"></span></button>' +
    '</div>';
  applyImages(box); bindBack(box);
  document.getElementById('arStart').addEventListener('click', () => {
    initAudio();
    const A = arenaState(s);
    A.started = true; A.idx = 0; A.qStart = Date.now();
    queueSave(); SFX.unlock();
    renderArena();
  });
}

function renderQuestion(s){
  const t = T[LANG], A = arenaState(s), i = A.idx, Q = QUESTIONS[s][i], n = QUESTIONS[s].length;
  const box = document.getElementById('v-arena');
  const answered = A.answers[i];
  if (!A.qStart) A.qStart = Date.now();
  const card = OTR[LANG].cards[['omar', 'layla', 'youssef', 'mona'].indexOf(Q.who)];
  let h = arenaHeader(s, A);
  h += '<div class="ar-q">';
  h += '<div class="ar-meta"><span class="ar-who"><img data-img="' + Q.who + '" alt=""><span>' + esc(card.name) + '</span></span>';
  h += '<span class="ar-qn">' + esc(t.qOf(i + 1, n)) + '</span>';
  h += '<span class="ar-streak' + (A.streak >= 2 ? ' hot' : '') + '">' + ICON('flame', 16) + '<b>' + A.streak + '</b></span></div>';
  h += '<div class="ar-timer"><div class="ar-timer-fill" id="arFill"></div><span id="arSecs">' + ARENA_TIME + '</span></div>';
  h += '<h2 class="ar-text">' + esc(Q.q[LANG]) + '</h2>';
  h += '<div class="ar-opts">';
  A.order[i].forEach((oi, pos) => {
    let cls = 'ar-opt s-' + SHAPES[pos];
    if (answered){
      if (oi === 0) cls += ' correct';
      else if (answered.pick === oi) cls += ' wrong';
      else cls += ' dim';
    }
    h += '<button class="' + cls + '" data-oi="' + oi + '"' + (answered ? ' disabled' : '') + '><span class="ar-shape">' + shapeSvg(SHAPES[pos]) + '</span><span>' + esc(Q.opts[oi][LANG]) + '</span></button>';
  });
  h += '</div>';
  h += '<div id="arReveal">' + (answered ? revealHtml(s, i, answered) : '') + '</div>';
  h += '</div>';
  box.innerHTML = h;
  applyImages(box); bindBack(box);
  box.querySelectorAll('[data-oi]').forEach(b => b.addEventListener('click', () => answer(s, parseInt(b.dataset.oi, 10), b)));
  bindReveal(s);
  if (!answered) startTimer(s);
  else { setTimerDisplay(answered.t != null ? Math.max(0, ARENA_TIME - answered.t) : 0); }
}
function setTimerDisplay(remain){
  const f = document.getElementById('arFill'), sec = document.getElementById('arSecs');
  if (!f) return;
  f.style.width = (remain / ARENA_TIME * 100) + '%';
  f.classList.toggle('warn', remain <= 10);
  f.classList.toggle('crit', remain <= 5);
  sec.textContent = Math.ceil(remain);
}
function startTimer(s){
  const A = P.arena[s];
  clearInterval(arenaTimer);
  let lastSec = null;
  const tick = () => {
    const el = (Date.now() - A.qStart) / 1000, remain = Math.max(0, ARENA_TIME - el);
    setTimerDisplay(remain);
    const sec = Math.ceil(remain);
    if (sec !== lastSec && sec <= 5 && sec > 0) SFX.tick();
    lastSec = sec;
    if (remain <= 0){ clearInterval(arenaTimer); answer(s, -1, null); }
  };
  tick();
  arenaTimer = setInterval(tick, 100);
}
function answer(s, oi, btn){
  const A = P.arena[s], i = A.idx;
  if (A.answers[i]) return;
  clearInterval(arenaTimer);
  const el = Math.min(ARENA_TIME, (Date.now() - A.qStart) / 1000);
  const ok = oi === 0;
  let base = 0, speed = 0, streakB = 0;
  if (ok){
    base = 100;
    speed = Math.round(100 * Math.max(0, ARENA_TIME - el) / ARENA_TIME);
    A.streak++;
    A.best = Math.max(A.best, A.streak);
    streakB = A.streak >= 2 ? Math.min(60, (A.streak - 1) * 20) : 0;
  } else A.streak = 0;
  const pts = base + speed + streakB;
  A.answers[i] = { pick: oi, ok, pts, base, speed, streakB, t: Math.round(el * 10) / 10 };
  P.scores['s' + s + 'a'] = arenaScore(A);
  queueSave();
  if (ok){
    SFX.correct();
    const target = btn || document.querySelector('.ar-opt[data-oi="0"]');
    if (target){ const [x, y] = centerOf(target); FX.burst(x, y, 40 + A.streak * 10, .8); floatPoints(pts, target, false); }
  } else SFX.wrong();
  renderQuestion(s);
  bumpHud();
  const sc = document.getElementById('arScore'); popEl(sc);
}
function revealHtml(s, i, a){
  const t = T[LANG], Q = QUESTIONS[s][i], last = i === QUESTIONS[s].length - 1;
  let h = '<div class="ar-reveal ' + (a.ok ? 'good' : 'bad') + '">';
  h += '<div class="ar-verdict">' + ICON(a.ok ? 'check' : 'clock', 22) + '<b>' + esc(a.ok ? t.correct : (a.pick === -1 ? t.timeUp : t.wrong)) + '</b>';
  h += '<span class="ar-gain">+' + a.pts + '</span></div>';
  if (a.ok){

/* ===================== PROJECT ===================== */
function projCtx(s){
  const d = P.project[s].data;
  const ctx = Object.assign({}, d);
  ctx._approach = P.project[2] ? P.project[2].data.approach : undefined;
  return ctx;
}
function isShown(f, ctx){ return !f.show || f.show(ctx); }
function isReq(f, ctx){ return typeof f.req === 'function' ? f.req(ctx) : !!f.req; }
function filled(f, v){
  if (f.type === 'radio') return v !== undefined && v !== null;
  if (f.type === 'chips') return Array.isArray(v) && v.length > 0;
  return typeof v === 'string' && v.trim().length > 0;
}
function reqStats(s){
  const ctx = projCtx(s); let need = 0, have = 0;
  PROJECT[s].fields.forEach(f => {
    if (f.type === 'recommend' || !isShown(f, ctx) || !isReq(f, ctx)) return;
    need++; if (filled(f, P.project[s].data[f.id])) have++;
  });
  return { need, have };
}
function recommendation(d){
  const ids = ['c_obj', 'c_budget', 'c_complex', 'c_context'];
  if (ids.some(k => d[k] === undefined)) return null;
  const b = ids.filter(k => d[k] === 1).length;
  return b >= 3 ? 1 : (b <= 1 ? 0 : 2);
}

function fieldHtml(s, f, d, ctx){
  const t = T[LANG], req = isReq(f, ctx), v = d[f.id];

  }

    h += '<div class="pj-chips">';

    arr.filter(x => typeof x === 'string').forEach(x => { h += '<button type="button" class="pj-chip on own" data-chipown="' + f.id + '" data-v="' + esc(x) + '">' + ICON('check', 14) + '<span>' + esc(x) + '</span></button>'; });
    h += '</div>';
    h += '<div class="pj-own"><input class="sn-input" data-ownin="' + f.id + '" placeholder="' + esc(t.addOwn) + '" maxlength="80"><button type="button" class="sn-btn ghost" data-ownadd="' + f.id + '">' + esc(t.add) + '</button></div>';

    if (f.tpl) h += '<button type="button" class="pj-help tpl" data-tpl="' + f.id + '">' + ICON('edit', 13) + esc(t.useTpl) + '</button>';
    (f.helpers || []).forEach((hp, i) => { h += '<button type="button" class="pj-help" data-help="' + f.id + '" data-i="' + i + '">' + esc(hp[LANG]) + '</button>'; });
    h += '</div>';

}
function fieldDef(s, id){ return PROJECT[s].fields.find(f => f.id === id); }
function bindFields(s, box){
  const d = P.project[s].data;
  box.querySelectorAll('[data-in]').forEach(el => el.addEventListener('input', () => {
    d[el.dataset.in] = el.value; queueSave(); markField(el.dataset.in, s); updateProjProgress(s);
  }));
  box.querySelectorAll('[data-radio]').forEach(el => el.addEventListener('click', () => {
    d[el.dataset.radio] = parseInt(el.dataset.i, 10); queueSave(); SFX.tick(); rerenderProject();
  }));
  box.querySelectorAll('[data-chip]').forEach(el => el.addEventListener('click', () => {
    const f = fieldDef(s, el.dataset.chip), i = parseInt(el.dataset.i, 10);
    let arr = Array.isArray(d[f.id]) ? d[f.id].slice() : [];
    if (arr.includes(i)) arr = arr.filter(x => x !== i);
    else { if (f.max && arr.length >= f.max){ SFX.locked(); el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); return; } arr.push(i); }
    d[f.id] = arr; queueSave(); SFX.tick(); rerenderProject();
  }));
  box.querySelectorAll('[data-chipown]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.chipown; d[id] = (d[id] || []).filter(x => x !== el.dataset.v); queueSave(); rerenderProject();
  }));
  box.querySelectorAll('[data-ownadd]').forEach(el => el.addEventListener('click', () => addOwn(s, el.dataset.ownadd)));
  box.querySelectorAll('[data-ownin]').forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addOwn(s, el.dataset.ownin); } }));
  box.querySelectorAll('[data-help]').forEach(el => el.addEventListener('click', () => {
    const f = fieldDef(s, el.dataset.help), txt = f.helpers[parseInt(el.dataset.i, 10)][LANG];
    const input = box.querySelector('[data-in="' + f.id + '"]');
    if (f.type === 'text') input.value = txt;
    else input.value = input.value.trim() ? input.value.trim() + '\n' + txt : txt;
    d[f.id] = input.value; queueSave(); markField(f.id, s); updateProjProgress(s); SFX.tick();
    el.classList.add('used');
  }));
  box.querySelectorAll('[data-tpl]').forEach(el => el.addEventListener('click', () => {
    const f = fieldDef(s, el.dataset.tpl), input = box.querySelector('[data-in="' + f.id + '"]');
    input.value = input.value.trim() ? input.value.trim() + '\n' + f.tpl[LANG] : f.tpl[LANG];
    d[f.id] = input.value; queueSave(); markField(f.id, s); updateProjProgress(s); input.focus(); SFX.tick();
  }));
}
function addOwn(s, id){
  const input = document.querySelector('[data-ownin="' + id + '"]');

  const f = fieldDef(s, id), d = P.project[s].data;
  const arr = Array.isArray(d[id]) ? d[id].slice() : [];
  if (f.max && arr.length >= f.max){ SFX.locked(); return; }
  if (!arr.includes(v)) arr.push(v);
  d[id] = arr; queueSave(); SFX.tick(); rerenderProject();
}
function rerenderProject(){

function markField(id, s){

function updateProjProgress(s){

function completeProject(s, btn){

function loadImg(src){ return new Promise(res => { if (!src){ res(null); return; } const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
async function drawCertificate(cv){
  const t = T[LANG], c = t.cert, ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  const fam = LANG === 'ar' ? 'Tajawal, sans-serif' : 'Poppins, sans-serif';
  try { await Promise.all([document.fonts.load('900 80px Tajawal'), document.fonts.load('700 40px Tajawal'), document.fonts.load('800 80px Poppins'), document.fonts.load('600 40px Poppins')]); } catch(e){}
  const [sb, sec] = await Promise.all([loadImg(IMGS.brand), loadImg(SEC_LOGO)]);
  ctx.direction = LANG === 'ar' ? 'rtl' : 'ltr';
  // background
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0b0b33'); g.addColorStop(1, '#05051c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = (x, y, r, col) => { const rg = ctx.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); };
  glow(260, 160, 700, 'rgba(77,136,232,.28)'); glow(W - 200, H - 120, 760, 'rgba(255,188,58,.18)'); glow(W / 2, H / 2, 600, 'rgba(64,189,169,.08)');
  // borders
  ctx.strokeStyle = '#FFBC3A'; ctx.lineWidth = 6; ctx.strokeRect(60, 60, W - 120, H - 120);
  ctx.strokeStyle = 'rgba(255,188,58,.35)'; ctx.lineWidth = 2; ctx.strokeRect(84, 84, W - 168, H - 168);
  // logos
  const logoH = 96;
  if (sb){ const w = sb.width * (logoH / sb.height); ctx.drawImage(sb, LANG === 'ar' ? W - 160 - w : 160, 140, w, logoH); }
  const secX = LANG === 'ar' ? 160 : W - 160;
  if (sec){ const w = sec.width * (logoH / sec.height); ctx.drawImage(sec, LANG === 'ar' ? secX : secX - w, 140, w, logoH); }
  else {
    ctx.save(); ctx.strokeStyle = 'rgba(235,244,255,.55)'; ctx.lineWidth = 3;
    const bw = 200, bx = LANG === 'ar' ? secX : secX - bw;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, 140, bw, logoH, 16) : ctx.rect(bx, 140, bw, logoH); ctx.stroke();
    ctx.fillStyle = '#EBF4FF'; ctx.font = '800 54px Poppins, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'ltr';
    ctx.fillText('SEC', bx + bw / 2, 140 + logoH / 2 + 2); ctx.restore(); ctx.direction = LANG === 'ar' ? 'rtl' : 'ltr';
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // heading
  ctx.fillStyle = '#FFBC3A'; ctx.font = '700 40px ' + fam; ctx.fillText(LANG === 'en' ? c.heading.toUpperCase() : c.heading, W / 2, 360);
  ctx.fillStyle = 'rgba(235,244,255,.75)'; ctx.font = '500 38px ' + fam; ctx.fillText(c.certifies, W / 2, 450);
  // name
  ctx.fillStyle = '#FFFFFF'; let fs = 104; ctx.font = '900 ' + fs + 'px ' + fam;
  while (ctx.measureText(P.name).width > W - 420 && fs > 56){ fs -= 4; ctx.font = '900 ' + fs + 'px ' + fam; }
  ctx.fillText(P.name, W / 2, 580);
  ctx.strokeStyle = 'rgba(255,188,58,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W / 2 - 360, 620); ctx.lineTo(W / 2 + 360, 620); ctx.stroke();
  ctx.fillStyle = 'rgba(235,244,255,.8)'; ctx.font = '500 38px ' + fam; ctx.fillText(c.from + ' ' + P.dept, W / 2, 685);
  ctx.fillText(c.completed, W / 2, 770);
  ctx.fillStyle = '#FFD98A'; ctx.font = '800 50px ' + fam;
  let ttl = PROGRAM_TITLE[LANG]; fs = 50;
  while (ctx.measureText('«' + ttl + '»').width > W - 380 && fs > 32){ fs -= 2; ctx.font = '800 ' + fs + 'px ' + fam; }
  ctx.fillText(LANG === 'ar' ? '«' + ttl + '»' : '“' + ttl + '”', W / 2, 850);
  ctx.fillStyle = 'rgba(235,244,255,.8)'; ctx.font = '500 38px ' + fam; ctx.fillText(c.earned, W / 2, 930);
  // badge emblem
  const bx = W / 2, by = 1095, R = 108;
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i < 6; i++){ const a = Math.PI / 3 * i - Math.PI / 2; const x = bx + R * Math.cos(a), y = by + R * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath();
  const bg = ctx.createLinearGradient(bx, by - R, bx, by + R); bg.addColorStop(0, '#FFD98A'); bg.addColorStop(.55, '#FFBC3A'); bg.addColorStop(1, '#C8871A');
  ctx.fillStyle = bg; ctx.shadowColor = 'rgba(255,188,58,.6)'; ctx.shadowBlur = 50; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#FFF2CC'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = '#080828';
  ctx.beginPath();
  for (let i = 0; i < 10; i++){ const r = i % 2 ? 22 : 50, a = Math.PI / 5 * i - Math.PI / 2; const x = bx + r * Math.cos(a), y = by - 18 + r * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath(); ctx.fill();
  ctx.direction = 'ltr'; ctx.font = '800 26px Poppins, sans-serif'; ctx.fillText('GAME MASTER', bx, by + 66);
  ctx.restore();
  ctx.direction = LANG === 'ar' ? 'rtl' : 'ltr';
  // footer
  const dateStr = new Date().toLocaleDateString(LANG === 'ar' ? 'ar-SA-u-ca-gregory-nu-latn' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
  ctx.fillStyle = 'rgba(235,244,255,.7)'; ctx.font = '500 32px ' + fam;
  ctx.textAlign = LANG === 'ar' ? 'right' : 'left';
  ctx.fillText(c.date + ': ' + dateStr, LANG === 'ar' ? W - 170 : 170, H - 150);
  ctx.textAlign = LANG === 'ar' ? 'left' : 'right';
  ctx.fillText(c.issuer, LANG === 'ar' ? 170 : W - 170, H - 150);
  ctx.textAlign = 'center';
}
function downloadCert(){

  } catch(e){}
}
async function refreshBoard(){
  if (!P || IS_TRAINER) return;
  try {
    const b = await API.board(SESSION);
    if (Array.isArray(b)){
      BOARD = b; renderHud();
      const rr = document.getElementById('resRank'); if (rr){ const r = myRank(); rr.textContent = r ? '#' + r : '–'; }
    }
  } catch(e){}
}

/* ===================== LANGUAGE ===================== */
function applyLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.title = T[l].appName + ' · ' + T[l].appSub;
  setText('langToggle', T[l].langToggle);
  setText('topTagText', IS_TRAINER ? T[l].tr.title : T[l].tag);
  setText('footerText', T[l].appName + ' · ' + PROGRAM_TITLE[l]);
  try { localStorage.setItem('sn_lang', l); } catch(e){}
  if (VIEW === 'opener') Opener.setLang(l);
  render();
}
function toggleLang(){ applyLang(LANG === 'ar' ? 'en' : 'ar'); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && VIEW === 'opener') Opener.onEscape();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && P) { storeP(); API.save(P, total()).catch(() => {}); } });

/* ===================== BOOT ===================== */
(function boot(){
  try { const l = localStorage.getItem('sn_lang'); if (l === 'en' || l === 'ar') LANG = l; } catch(e){}
  applyImages();
  renderSoundBtns();
  if (IS_TRAINER){
    applyLang(LANG);
    SN.go('trainer');
    return;
  }
  P = loadP();
  if (P && P.session === SESSION){
    API.getStage(SESSION).then(s => { if (typeof s === 'number') STAGE = s; if (VIEW === 'map') renderMap(); }).catch(() => {});
    API.join(SESSION, P).catch(() => {});
    applyLang(LANG);
    SN.go('map');
    refreshBoard();
  } else {
    P = null;
    applyLang(LANG);
    SN.go('join');
  }
  setInterval(pollStage, 4000);
  setInterval(refreshBoard, 10000);
})();
</script>
